<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - BlackJack</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        body {
            background-color: #111111;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .error-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(225, 29, 72, 0.12);
            color: #e11d48;
        }

        .error-code {
            color: #e11d48;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .error-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 0.95rem;
            color: #a1a1aa;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary-action {
            background-color: #e11d48;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s ease;
            display: inline-block;
        }

        .btn-primary-action:hover {
            background-color: #be123c;
            color: #ffffff;
        }

        .btn-secondary-action {
            background-color: transparent;
            color: #d4d4d8;
            border: 1px solid #3f3f46;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-block;
        }

        .btn-secondary-action:hover {
            background-color: #27272a;
            color: #ffffff;
            border-color: #52525b;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="lock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>

    <div class="error-code">401 / 403 Restricted</div>
    <h1 class="error-title">Access Restricted</h1>
    <p class="error-desc">
        You are not authorized to view this page. Please log in with an authorized account or return to the main storefront.
    </p>

    <div class="action-group">
        <a th:href="@{/login}" href="/login" class="btn-primary-action">
            Log In to Continue
        </a>
        <a th:href="@{/}" href="/" class="btn-secondary-action">
            Back to Home
        </a>
    </div>
</div>

</body>
</html>
