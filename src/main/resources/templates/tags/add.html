<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/public_layout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div layout:fragment="content">
		<h2>Add Tag Form</h2>
		<div class="col-md-5">
			<form method="post" th:action="@{/tags/add}" th:object="${tag}">
				<div class="form-group">
					<label class="form-label">Name:</label> <input class="form-control"
						type="text" th:field="${tag.name}" />
				</div>
				<div class="form-group">
					<label class="form-label">Description:</label>
					<textarea class="form-control" rows="5" cols="100"
						th:field="${tag.description}"></textarea>
				</div>
				<div class="mt-3">
					<input type="submit" value="CreateTag" />
				</div>
				
			</form>
		</div>

	</div>

</body>
</html>
