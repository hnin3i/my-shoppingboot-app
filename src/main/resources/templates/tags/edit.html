<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h2>Edit Tag Form</h2>
	<form method="post" th:action="@{/tags/edit}" th:object="${tag}" >
		<input type="hidden" th:field="${tag.id}"/>
		<div>
			<label>Name:</label>
			<input type="text" th:field="${tag.name}"/>
		</div>
		<div>
			<label>Description:</label>
			<textarea rows="5" cols="100" th:field="${tag.description}"></textarea>
		</div>
		<input type="submit" value="UpdateTag"/>
	</form>
</body>
</html>
