<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #222222;
            --card-dark: #1a1a1a;
            --input-bg: #2a2a2a;
            --border-color: #383838;
            --text-light: #f5f5f5;
            --accent-red: #e50010;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.2px;
        }
        .form-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
        }
        .auth-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
        }
        .form-control {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            padding: 0.75rem 0.85rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--text-light);
            color: var(--text-light);
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #666;
        }
        .input-group .btn {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-light);
        }
        .otp-input {
            letter-spacing: 0.5rem;
            font-weight: 700;
        }
        .btn-action {
            background-color: #ffffff;
            color: #222222;
            border-radius: 0 !important;
            padding: 0.85rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        /* Button loading & fade transitions */
		.btn-action, .auth-link, .btn-outline-action {
		    transition: opacity 0.25s ease, background-color 0.2s ease, color 0.2s ease;
		}
		.faded {
		    opacity: 0.35 !important;
		    pointer-events: none !important;
		}
		.btn-spinner {
		    display: inline-block;
		    width: 1rem;
		    height: 1rem;
		    border: 2px solid currentColor;
		    border-right-color: transparent;
		    border-radius: 50%;
		    animation: spinner-border 0.75s linear infinite;
		    vertical-align: -0.125em;
		    margin-right: 0.5rem;
		}
		@keyframes spinner-border {
		    to { transform: rotate(360deg); }
		}
        .btn-action:hover {
            background-color: var(--accent-red);
            color: #ffffff;
        }
        .btn-outline-action {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            border-radius: 0 !important;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            padding: 0.45rem 1rem;
        }
        .btn-outline-action:hover:not(:disabled) {
            border-color: var(--text-light);
            color: var(--text-light);
        }
        .btn-outline-action:disabled {
            border-color: #333;
            color: #666;
        }
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text-light);
        }
        .alert {
            border-radius: 0 !important;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="form-title">New Password</div>
                <p class="small text-secondary mt-1">
                    Enter code sent to <strong class="text-light" th:text="${email}">user@example.com</strong>
                </p>
            </div>

            <div class="auth-card p-4">
                <div th:if="${error}" class="alert alert-danger py-2 text-center" th:text="${error}"></div>
                <div th:if="${param.resent}" class="alert alert-success py-2 text-center">Fresh recovery code sent.</div>

                <form th:action="@{/reset-password}" method="post" id="resetForm">
                    <input type="hidden" name="email" th:value="${email}" />

                    <div class="mb-3">
                        <label for="otp" class="form-label text-center w-100">Verification Code</label>
                        <input type="text" id="otp" name="otp" class="form-control text-center fs-4 otp-input" 
                               maxlength="6" placeholder="000000" pattern="[0-9]{6}" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="input-group">
                            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword', 'toggleNewPw')">
                                <i id="toggleNewPw" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword', 'toggleConfirmPw')">
                                <i id="toggleConfirmPw" class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div id="passwordMismatch" class="text-danger small mt-1 d-none">Passwords do not match.</div>
                    </div>

                    <button type="submit" class="btn btn-action w-100 mb-3">Save New Password</button>
                </form>

                <div class="text-center pt-3 border-top border-secondary-subtle">
                    <p class="small text-secondary mb-2">Didn't receive the code?</p>
                    <form th:action="@{/forgot-password}" method="post" class="d-inline">
                        <input type="hidden" name="email" th:value="${email}" />
                        <button type="submit" id="resendResetBtn" class="btn btn-outline-action" disabled>
                            Resend Code (<span id="resetTimer">30</span>s)
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}

document.getElementById('resetForm').addEventListener('submit', function(e) {
    const pw = document.getElementById('newPassword').value;
    const cpw = document.getElementById('confirmPassword').value;
    const mismatch = document.getElementById('passwordMismatch');

    if (pw !== cpw) {
        e.preventDefault();
        mismatch.classList.remove('d-none');
        return;
    }
    mismatch.classList.add('d-none');

    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="btn-spinner"></span> Updating password...';

    // Fade out resend code button
    document.querySelectorAll('#resendResetBtn').forEach(el => el.classList.add('faded'));
    this.submit();
});

// Resend in Reset Password
const resendResetForm = document.querySelector('form[action$="/forgot-password"]');
if (resendResetForm) {
    resendResetForm.addEventListener('submit', function() {
        const btn = document.getElementById('resendResetBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span> Sending...';

        // Fade out save password button
        document.querySelectorAll('.btn-action').forEach(el => el.classList.add('faded'));
        this.submit();
    });
}

let timeLeft = 30;
const timerEl = document.getElementById('resetTimer');
const resendBtn = document.getElementById('resendResetBtn');

const countdown = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
        clearInterval(countdown);
        resendBtn.disabled = false;
        resendBtn.innerText = 'Resend Code';
    } else {
        timerEl.innerText = timeLeft;
    }
}, 1000);
</script>

</body>
</html>
