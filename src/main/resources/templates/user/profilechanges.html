<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile - BLACKJACK</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background: #f7f7fb;
	color: #222;
	font-family: Arial, Helvetica, sans-serif;
}

/* PROFILE CONTAINER */
.profile-container {
	max-width: 760px;
	margin: 35px auto;
	padding: 0 15px;
}

/* PROFILE CARD */
.profile-card {
	background: #fff;
	border: 1px solid #e5e5e5;
	border-radius: 12px;
	overflow: hidden;
	box-shadow: 0 6px 22px rgba(0, 0, 0, 0.05);
}

/* PROFILE HEADER */
.profile-header {
	background: #050505;
	color: #fff;
	padding: 25px 30px;
}

.profile-header-content {
	display: flex;
	align-items: center;
	gap: 18px;
}

.profile-photo-wrapper {
	position: relative;
	width: 82px;
	height: 82px;
	flex-shrink: 0;
}

.profile-photo {
	width: 82px;
	height: 82px;
	border-radius: 50%;
	object-fit: cover;
	border: 3px solid #fff;
	background: #eee;
}

.active-dot {
	position: absolute;
	right: 1px;
	bottom: 3px;
	width: 15px;
	height: 15px;
	background: #22c55e;
	border: 2px solid #050505;
	border-radius: 50%;
}

.profile-info {
	min-width: 0;
}

.profile-name {
	margin: 0 0 5px;
	font-size: 22px;
	font-weight: 700;
}

.profile-email {
	color: #aaa;
	font-size: 13px;
	word-break: break-word;
}

/* PROFILE BODY */
.profile-body {
	padding: 28px 30px;
}

.section-title {
	font-size: 18px;
	font-weight: 650;
	margin-bottom: 6px;
}

.section-subtitle {
	color: #888;
	font-size: 12px;
	margin-bottom: 22px;
}

/* ALERT */
.alert {
	border-radius: 7px;
	font-size: 13px;
	padding: 9px 12px;
}

/* FORM */
.form-label {
	font-size: 12px;
	font-weight: 600;
	color: #333;
	margin-bottom: 5px;
}

.form-control {
	border: 1px solid #ddd;
	border-radius: 6px;
	padding: 8px 10px;
	font-size: 13px;
}

.form-control:focus {
	border-color: #111;
	box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);
}

textarea.form-control {
	resize: vertical;
	min-height: 75px;
}

/* PHOTO UPLOAD */
.photo-upload-area {
	display: flex;
	align-items: center;
	gap: 12px;
}

.change-photo-btn {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 7px 13px;
	background: #fff;
	color: #111;
	border: 1px solid #ddd;
	border-radius: 6px;
	cursor: pointer;
	font-size: 12px;
	transition: 0.2s;
}

.change-photo-btn:hover {
	background: #f1f1f1;
	border-color: #bbb;
}

.upload-text {
	color: #999;
	font-size: 11px;
}

/* DIVIDER */
.form-divider {
	height: 1px;
	background: #eee;
	margin: 22px 0;
}

/* BUTTONS */
.save-btn {
	background: #050505;
	color: #fff;
	border: none;
	padding: 8px 20px;
	border-radius: 6px;
	font-size: 13px;
	font-weight: 600;
	transition: 0.2s;
}

.save-btn:hover {
	background: #333;
	color: #fff;
}

.cancel-btn {
	display: inline-flex;
	align-items: center;
	background: #fff;
	color: #222;
	border: 1px solid #ddd;
	padding: 8px 20px;
	border-radius: 6px;
	text-decoration: none;
	font-size: 13px;
	transition: 0.2s;
}

.cancel-btn:hover {
	background: #f1f1f1;
	color: #222;
}

/* RESPONSIVE */
@media ( max-width : 767px) {
	.profile-container {
		margin: 20px auto;
		padding: 0 10px;
	}
	.profile-header {
		padding: 22px 20px;
	}
	.profile-header-content {
		gap: 14px;
	}
	.profile-photo-wrapper, .profile-photo {
		width: 68px;
		height: 68px;
	}
	.profile-name {
		font-size: 19px;
	}
	.profile-email {
		font-size: 12px;
	}
	.profile-body {
		padding: 22px 18px;
	}
	.photo-upload-area {
		align-items: flex-start;
		flex-direction: column;
		gap: 7px;
	}
	.form-buttons {
		flex-direction: column-reverse;
	}
	.save-btn, .cancel-btn {
		width: 100%;
		justify-content: center;
	}
}
</style>

</head>


<body>

	<div class="profile-container">

		<div class="profile-card">

			<!-- PROFILE HEADER -->

			<div class="profile-header">

				<div class="profile-header-content">

					<!-- Profile Photo -->

					<div class="profile-photo-wrapper">

						<img id="profilePreview"
							th:src="${changeProfileModel.profile != null and !changeProfileModel.profile.isEmpty()
                                  ? changeProfileModel.profile
                                  : '/images/profile/default.jpg'}"
							alt="Profile" class="profile-photo"> <span
							class="active-dot"></span>

					</div>


					<!-- Profile Information -->

					<div class="profile-info">

						<h1 class="profile-name" th:text="${changeProfileModel.name}">
							User Name</h1>

						<div class="profile-email" th:text="${changeProfileModel.email}">
							user@example.com</div>

					</div>

				</div>

			</div>


			<!-- PROFILE BODY -->

			<div class="profile-body">

				<h2 class="section-title">Profile Information</h2>

				<p class="section-subtitle">Update your personal information and
					profile photo.</p>


				<!-- SUCCESS MESSAGE -->

				<div th:if="${successMessage}" class="alert alert-success"
					role="alert">

					<i class="bi bi-check-circle me-2"></i> <span
						th:text="${successMessage}"> Profile updated successfully!
					</span>

				</div>


				<!-- ERROR MESSAGE -->

				<div th:if="${errorMessage}" class="alert alert-danger" role="alert">

					<i class="bi bi-exclamation-circle me-2"></i> <span
						th:text="${errorMessage}"> Failed to update profile. </span>

				</div>


				<!-- FORM -->

				<form th:action="@{/user/profilechanges}"
					th:object="${changeProfileModel}" method="post"
					enctype="multipart/form-data">


					<!-- Hidden ID -->

					<input type="hidden" th:field="*{id}">


					<!-- PROFILE PHOTO -->

					<div class="mb-3">

						<label class="form-label d-block"> Profile Photo </label>

						<div class="photo-upload-area">

							<label for="profile" class="change-photo-btn"> <i
								class="bi bi-camera"></i> Change Photo

							</label> <input type="file" id="profile" name="profilePhoto"
								accept="image/*" hidden> <span class="upload-text">
								Choose a new image for your profile. </span>

						</div>

					</div>


					<div class="form-divider"></div>


					<!-- BASIC INFORMATION -->

					<div class="row">


						<!-- Full Name -->

						<div class="col-md-6 mb-3">

							<label for="name" class="form-label"> Full Name </label> <input
								type="text" id="name" th:field="*{name}" class="form-control"
								placeholder="Enter your full name" required>

						</div>


						<!-- Email -->

						<div class="col-md-6 mb-3">

							<label for="email" class="form-label"> Email </label> <input
								type="email" id="email" th:field="*{email}" class="form-control"
								placeholder="Enter your email" required>

						</div>


						<!-- Phone -->

						<div class="col-md-6 mb-3">

							<label for="phone" class="form-label"> Phone </label> <input
								type="text" id="phone" th:field="*{phone}" class="form-control"
								placeholder="09 123 456 789">

						</div>


						<!-- Account Status -->

						<div class="col-md-6 mb-3">

							<label for="status" class="form-label"> Account Status </label> <input
								type="text" id="status" class="form-control" value="Active"
								readonly>

						</div>


						<!-- Address -->

						<div class="col-12 mb-2">

							<label for="address" class="form-label"> Delivery Address

							</label>

							<textarea id="address" th:field="*{address}" class="form-control"
								rows="3" placeholder="Enter your delivery address"></textarea>

						</div>

					</div>


					<div class="form-divider"></div>


					<!-- BUTTONS -->

					<div class="form-buttons d-flex gap-2 justify-content-end">

						<a th:href="@{/user/profile}" class="cancel-btn"> Cancel </a>


						<button type="submit" class="save-btn">

							<i class="bi bi-check-lg me-1"></i> Save Changes

						</button>

					</div>

				</form>

			</div>

		</div>

	</div>


	<!-- PHOTO PREVIEW -->

	<script>

    const profilePhoto =
        document.getElementById("profile");

    const profilePreview =
        document.getElementById("profilePreview");


    profilePhoto.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            profilePreview.src =
                URL.createObjectURL(file);

        }

    });

</script>


	<!-- DUPLICATE EMAIL BROWSER VALIDATION -->

	<script th:inline="javascript">

    const email =
        document.getElementById("email");

    email.addEventListener("input", function () {

        email.setCustomValidity("");

    });


    const duplicateEmail =
        /*[[${duplicateEmail}]]*/ false;


    if (duplicateEmail) {

        email.setCustomValidity(
            "This email is already registered."
        );

        email.reportValidity();

    }

</script>


</body>

</html>
