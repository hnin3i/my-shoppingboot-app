<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #222222;
            --card-dark: #1a1a1a;
            --input-bg: #2a2a2a;
            --border-color: #383838;
            --text-light: #f5f5f5;
            --text-muted: #9e9e9e;
            --accent-red: #e50010;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.2px;
        }
        .form-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
        }
        .auth-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
        }
        .form-control {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            padding: 0.75rem 0.85rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--text-light);
            color: var(--text-light);
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #666;
        }
        .input-group .btn {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-light);
        }
        .btn-action {
            background-color: #ffffff;
            color: #222222;
            border-radius: 0 !important;
            padding: 0.85rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .btn-action:hover {
            background-color: var(--accent-red);
            color: #ffffff;
        }
        /* Button loading & fade transitions */
		.btn-action, .auth-link, .btn-outline-action {
    		transition: opacity 0.25s ease, background-color 0.2s ease, color 0.2s ease;
		}
		.faded {
    		opacity: 0.35 !important;
    		pointer-events: none !important;
		}
		.btn-spinner {
    		display: inline-block;
    		width: 1rem;
    		height: 1rem;
    		border: 2px solid currentColor;
    		border-right-color: transparent;
    		border-radius: 50%;
    		animation: spinner-border 0.75s linear infinite;
    		vertical-align: -0.125em;
    		margin-right: 0.5rem;
		}		
		@keyframes spinner-border {
    		to { transform: rotate(360deg); }
		}
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text-light);
        }
        .alert {
            border-radius: 0 !important;
            font-size: 0.85rem;
        }
        .auth-link {
            color: var(--text-light);
            font-weight: 600;
            text-decoration: underline;
        }
        .auth-link:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <div class="form-title">Create Account</div>
                <p class="small text-secondary mt-1">Sign up to enjoy personalized shopping perks</p>
            </div>

            <div class="auth-card p-4">
                <div th:if="${error}" class="alert alert-danger py-2 text-center" th:text="${error}"></div>

                <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Jane Doe" required autofocus>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="09123456789">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Delivery Address</label>
                        <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="Street, City">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', 'toggleIcon1')">
                                <i id="toggleIcon1" class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword', 'toggleIcon2')">
                                <i id="toggleIcon2" class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div id="passwordMismatch" class="text-danger small mt-1 d-none">Passwords do not match.</div>
                    </div>

                    <button type="submit" class="btn btn-action w-100">Sign up</button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-secondary">Already a member?</span> <a th:href="@{/login}" class="auth-link">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}

		document.getElementById('registerForm').addEventListener('submit', function(e) {
		    const pw = document.getElementById('password').value;
		    const cpw = document.getElementById('confirmPassword').value;
		    const mismatchMsg = document.getElementById('passwordMismatch');
		
		    if (pw !== cpw) {
		        e.preventDefault();
		        mismatchMsg.classList.remove('d-none');
		        return;
		    }
		    mismatchMsg.classList.add('d-none');
		
		    // Trigger button loading & fade out other actions
		    const submitBtn = this.querySelector('button[type="submit"]');
		    submitBtn.disabled = true;
		    submitBtn.innerHTML = '<span class="btn-spinner"></span> Creating account...';
		
		    document.querySelectorAll('.auth-link').forEach(el => el.classList.add('faded'));
		
		    // Submit programmatically since button is now disabled
		    this.submit();
		});
</script>

</body>
</html>
