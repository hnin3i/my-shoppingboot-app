<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - BLACKJACK</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: #212529;
        }
        
        /* Storefront Top Navbar */
        .navbar-custom { 
            background-color: #0f172a; 
            padding: 1rem 0;
        }
        .navbar-brand { 
            font-weight: 900; 
            color: #e11d48 !important; 
            letter-spacing: 1px; 
            font-size: 1.5rem;
        }
        .nav-link {
            color: #f8fafc !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #cbd5e1 !important;
        }
        
        /* Form Card */
        .profile-card { 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            background: #ffffff;
        }
        .form-label { 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: #6c757d; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
        }
        
        /* Buttons */
        .btn-brand { 
            background-color: #e11d48; 
            color: white; 
            font-weight: 600; 
            padding: 10px 24px; 
            border-radius: 8px; 
            border: none; 
            transition: 0.2s;
        }
        .btn-brand:hover { 
            background-color: #be123c; 
            color: white; 
        }
        .btn-cancel { 
            background-color: #f1f5f9; 
            color: #475569; 
            font-weight: 600; 
            padding: 10px 24px; 
            border-radius: 8px; 
            text-decoration: none; 
            border: 1px solid #e2e8f0;
        }
        .btn-cancel:hover { 
            background-color: #e2e8f0; 
            color: #1e293b; 
        }
    </style>
</head>
<body>

    <!-- Customer Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">BLACKJACK</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list text-white" style="font-size: 1.5rem;"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products}">Shop</a></li>
                </ul>
                <ul class="navbar-nav align-items-lg-center gap-2">
                    <li class="nav-item"><a class="nav-link" th:href="@{/cart}"><i class="bi bi-cart3 me-1"></i> Cart</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> My Account
                            </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2">
                            <li><a class="dropdown-item fw-medium" th:href="@{/user/edit}">Edit Profile</a></li>
                            <li><a class="dropdown-item fw-medium" th:href="@{/user/history}">Order History</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item fw-medium text-danger" th:href="@{/logout}">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                
                <div class="mb-4 text-center">
                    <h2 class="fw-bold mb-1">Account Settings</h2>
                    <p class="text-muted">Manage your personal information and delivery address</p>
                </div>

                <div class="card profile-card p-4 p-md-5">
                    
                    <!-- Flash feedback messages -->
                    <div th:if="${successMessage}" class="alert alert-success border-0 py-3 d-flex align-items-center mb-4">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}">Profile updated successfully!</span>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger border-0 py-3 d-flex align-items-center mb-4">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">Failed to update profile.</span>
                    </div>

                    <!-- Customer Form -->
                    <form th:action="@{/user/edit}" th:object="${changeProfileModel}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="John Doe" required />
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="09 123 456 789" />
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Delivery Address</label>
                            <textarea id="address" th:field="*{address}" class="form-control" rows="3" placeholder="Enter your full shipping address"></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="profile" class="form-label">Profile Image (Path or URL)</label>
                            <input type="file" id="profile" th:field="*{profile}" class="form-control" placeholder="avatar.jpg" />
                        </div>

                        <hr class="text-muted my-4">

                        <div class="d-flex justify-content-end align-items-center gap-3">
                        <a th:href="@{/user/edit}" class="btn-cancel">Cancel</a>
                            <button type="submit" class="btn btn-brand">Update Profile</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
