<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header" class="shop-header">
    <!-- Google Fonts & Bootstrap Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Embedded Header Stylesheet -->
    <style>
        .shop-header {
            background-color: #222;
            border-bottom: 1px solid #e5e5e5;
            /* Sticky Header Properties */
            position: sticky;
            top: 0;
            z-index: 1000; /* Keeps header above other page elements */
        }

        .shop-brand {
            font-family: 'Pacifico', cursive !important;
            font-size: 2.2rem !important;
            font-weight: 400 !important;
            color: #e5001a !important;
            text-transform: none !important;
            text-decoration: none !important;
            letter-spacing: 0.5px;
            display: inline-block;
            transform: skewX(-5deg);
            line-height: 1;
        }

        /* Shopping Cart Icon Styling & Alignment */
        .shop-icon-link {
            color: #fff !important;
            padding: 0;
            margin-right: 3rem; /* Moves icon inward away from right edge */
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .shop-icon-link:hover {
            opacity: 0.7;
            color: #fff !important;
        }
    </style>

    <nav class="navbar shop-navbar py-3">
        <div class="container-fluid px-4 px-lg-5 d-flex align-items-center justify-content-between">
            
            <!-- Left spacer matching icon offset to keep brand centered -->
            <div class="header-left d-none d-lg-block" style="flex: 1; margin-left: 1.5rem;"></div>

            <!-- Mobile Navigation Toggle -->
            <button class="navbar-toggler border-0 shadow-none d-lg-none" type="button"
                    data-bs-toggle="collapse" data-bs-target="#shopNavbar"
                    aria-controls="shopNavbar" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Centered Red Script Brand Logo -->
            <div class="header-center text-center d-flex align-items-center justify-content-center" style="flex: 1;">
                <a class="navbar-brand shop-brand m-0" th:href="@{/}">BlackJack</a>
            </div>

            <!-- Right Shopping Bag Icon (Offset slightly left) -->
            <div class="header-right text-end d-flex align-items-center justify-content-end" style="flex: 1;">
                <a class="nav-link shop-icon-link d-inline-flex align-items-center" th:href="@{/cart}" aria-label="Cart">
                    <svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
                        <path d="M3.5 8.5h17l-1 11H4.5l-1-11Z" />
                        <path d="M8 8.5V6a4 4 0 0 1 8 0v2.5" />
                    </svg>
                </a>
            </div>

        </div>
    </nav>
</header>
</html>
