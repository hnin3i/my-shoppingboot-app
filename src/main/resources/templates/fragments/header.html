<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
		
<header th:fragment="header" class="shop-header">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <nav class="navbar navbar-expand-lg navbar-dark shop-navbar py-0">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand shop-brand" th:href="@{/}">BlackJack</a>
            <span th:if="${session.loggedInUser != null}" th:text="${session.loggedInUser.name}">User</span>

            <button class="navbar-toggler border-0 shadow-none" type="button"
                    data-bs-toggle="collapse" data-bs-target="#shopNavbar"
                    aria-controls="shopNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="shopNavbar">
                <ul class="navbar-nav shop-menu me-auto">
                    <li class="nav-item"><a class="nav-link " th:href="@{/products?category=women}">WOMEN</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products?category=men}">MEN</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products?category=kids}">KIDS</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products?category=beauty}">BEAUTY</a></li>
                </ul>

                <ul class="navbar-nav shop-actions align-items-lg-center">
                    <li class="nav-item"><a class="nav-link shop-icon-link" th:href="@{/products}" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="d-lg-none ms-2">Search</span></a></li>
                    <li class="nav-item" th:if="${session.loggedInUser != null}"><a class="nav-link shop-icon-link" th:href="@{/user/profile}" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M4.5 21c.7-4.1 3.3-6.2 7.5-6.2s6.8 2.1 7.5 6.2"/></svg><span class="d-lg-none ms-2">Account</span></a></li>
                    <li class="nav-item" th:if="${session.loggedInUser == null}"><a class="nav-link shop-icon-link" href="javascript:void(0)" data-bs-toggle="modal" data-bs-target="#authPromptModal" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M4.5 21c.7-4.1 3.3-6.2 7.5-6.2s6.8 2.1 7.5 6.2"/></svg><span class="d-lg-none ms-2">Account</span></a></li>
                    <li class="nav-item"><a class="nav-link shop-icon-link position-relative" th:href="@{/cart}" aria-label="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5h17l-1 11H4.5l-1-11Z"/><path d="M8 8.5V6a4 4 0 0 1 8 0v2.5"/></svg><span class="cart-count" id="cartCount">0</span><span class="d-lg-none ms-2">Cart</span></a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- 1. Initial Auth Prompt Modal -->
<div class="modal fade" id="authPromptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
        <div class="modal-content text-light border-secondary" style="background-color: #18181b; border-radius: 14px;">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center px-4 pb-4">
                <div class="mb-3 d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 60px; height: 60px; background: rgba(225, 29, 72, 0.1); color: #e11d48;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h4 class="fw-bold mb-2">Welcome to BlackJack</h4>
                <p class="text-secondary small mb-4">You don't have an account or haven't logged in yet. Please log in or create an account to view your profile and orders.</p>
                
                <div class="d-grid gap-2">
                    <button class="btn fw-semibold text-white py-2" style="background-color: #e11d48; border-radius: 8px;" data-bs-target="#loginModal" data-bs-toggle="modal">
                        Log In
                    </button>
                    <button class="btn fw-semibold text-light py-2" style="background-color: #27272a; border: 1px solid #3f3f46; border-radius: 8px;" data-bs-target="#registerModal" data-bs-toggle="modal">
                        Create an Account
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 2. Pop-up Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <div class="modal-content text-light border-secondary" style="background-color: #18181b; border-radius: 14px;">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Sign In</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Email Address</label>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn w-100 fw-semibold text-white mt-2 py-2" style="background-color: #e11d48; border-radius: 8px;">
                        Sign In
                    </button>
                </form>
                <div class="text-center mt-3 small text-secondary">
                    Don't have an account? 
                    <a href="javascript:void(0)" class="text-decoration-none fw-semibold" style="color: #e11d48;" data-bs-target="#registerModal" data-bs-toggle="modal">Register</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 3. Pop-up Register Modal -->
<!-- Register Modal (Renders your existing register.html inside) -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 580px;">
        <div class="modal-content border-0" style="background-color: #121212; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);">
            <div class="modal-header border-0 pb-0" style="background-color: #121212;">
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0" style="background-color: #121212;">
                <!-- Embedded Frame pointing to your existing /register endpoint -->
                <iframe th:src="@{/register}" 
                        style="width: 100%; height: 680px; border: none; display: block;" 
                        loading="lazy">
                </iframe>
            </div>
        </div>
    </div>
</div>
</header>
