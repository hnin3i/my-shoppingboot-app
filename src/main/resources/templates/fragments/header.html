<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="shop-header">
    <nav class="navbar navbar-expand-lg navbar-dark shop-navbar py-0">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand shop-brand" th:href="@{/}">BlackJack</a>

            <button class="navbar-toggler border-0 shadow-none" type="button"
                    data-bs-toggle="collapse" data-bs-target="#shopNavbar"
                    aria-controls="shopNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="shopNavbar">
                <ul class="navbar-nav shop-menu me-auto">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/products?category=women}">WOMEN</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products?category=men}">MEN</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products?category=kids}">KIDS</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products?category=home}">HOME</a></li>
                </ul>

                <ul class="navbar-nav shop-actions align-items-lg-center">
                    <li class="nav-item"><a class="nav-link shop-icon-link" th:href="@{/products}" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="d-lg-none ms-2">Search</span></a></li>
                    <li class="nav-item"><a class="nav-link shop-icon-link" th:href="@{/login}" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M4.5 21c.7-4.1 3.3-6.2 7.5-6.2s6.8 2.1 7.5 6.2"/></svg><span class="d-lg-none ms-2">Account</span></a></li>
                    <li class="nav-item"><a class="nav-link shop-icon-link" href="#" aria-label="Favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.8a5.4 5.4 0 0 0-7.7 0L12 5.9l-1.1-1.1a5.4 5.4 0 0 0-7.7 7.7L12 21l8.8-8.5a5.4 5.4 0 0 0 0-7.7Z"/></svg><span class="d-lg-none ms-2">Favorites</span></a></li>
                    <li class="nav-item"><a class="nav-link shop-icon-link position-relative" th:href="@{/cart}" aria-label="Cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5h17l-1 11H4.5l-1-11Z"/><path d="M8 8.5V6a4 4 0 0 1 8 0v2.5"/></svg><span class="cart-count" id="cartCount">0</span><span class="d-lg-none ms-2">Cart</span></a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
