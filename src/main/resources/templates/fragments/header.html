<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header" class="shop-header">
	<nav class="navbar navbar-expand-lg navbar-dark shop-navbar py-0">
		<div class="container-fluid px-3 px-lg-4">
			<a class="navbar-brand shop-brand" th:href="@{/}">BlackJack</a>

			<button class="navbar-toggler border-0 shadow-none" type="button"
				data-bs-toggle="collapse" data-bs-target="#shopNavbar"
				aria-controls="shopNavbar" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="shopNavbar">

				<ul class="navbar-nav shop-menu me-auto">

					<li class="nav-item"><a class="nav-link " th:href="@{/}">HOME</a></li>
					<li class="nav-item"><a class="nav-link"
						th:href="@{/products}"> NEW ARRIVALS </a></li>
					
					<li class="nav-item dropdown categories-hover"><a
						class="nav-link dropdown-toggle" href="#" id="categoriesDropdown"
						role="button" data-bs-toggle="dropdown" aria-expanded="false">

							CATEGORIES </a>


						<ul class="dropdown-menu categories-dropdown"
							aria-labelledby="categoriesDropdown">


							<!-- FIRST 4 CATEGORIES -->
							<li th:each="category, stat : ${categories}"
								th:if="${stat.index < 4}"><a class="dropdown-item"
								th:href="@{/products(category=${category.name})}"
								th:text="${category.name}"> Category </a></li>


							<!-- DIVIDER -->
							<li th:if="${categories != null and #lists.size(categories) > 4}">

								<hr class="dropdown-divider">

							</li>


							<!-- MORE CATEGORIES -->
							<li id="moreCategories"><th:block
									th:each="category, stat : ${categories}"
									th:if="${stat.index >= 4}">

									<a class="dropdown-item"
										th:href="@{/products(category=${category.name})}"
										th:text="${category.name}"> Category </a>

								</th:block></li>


							<!-- SEE MORE -->
							<li th:if="${categories != null and #lists.size(categories) > 4}">

								<a class="dropdown-item see-more" href="#"
								id="seeMoreCategories"> SEE MORE → </a>

							</li>


						</ul></li>

					<li class="nav-item"><a class="nav-link"
						th:href="@{/products}"> SALE </a></li>




				</ul>

				<ul class="navbar-nav shop-actions align-items-lg-center">
					<li class="nav-item"><a class="nav-link shop-icon-link"
						th:href="@{/products}" aria-label="Search"><svg
								viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="11" cy="11" r="6.5" />
								<path d="m16 16 4.5 4.5" /></svg><span class="d-lg-none ms-2">Search</span></a></li>
					<li class="nav-item"><a class="nav-link shop-icon-link"
						th:href="@{/login}" aria-label="Account"><svg
								viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="12" cy="7" r="3.5" />
								<path d="M4.5 21c.7-4.1 3.3-6.2 7.5-6.2s6.8 2.1 7.5 6.2" /></svg><span
							class="d-lg-none ms-2">Account</span></a></li>
					<li class="nav-item"><a
						class="nav-link shop-icon-link position-relative"
						th:href="@{/cart}" aria-label="Cart"><svg viewBox="0 0 24 24"
								aria-hidden="true">
								<path d="M3.5 8.5h17l-1 11H4.5l-1-11Z" />
								<path d="M8 8.5V6a4 4 0 0 1 8 0v2.5" /></svg><span class="cart-count"
							id="cartCount">0</span><span class="d-lg-none ms-2">Cart</span></a></li>
				</ul>
			</div>
		</div>
	</nav>
</header>
