<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">My Order List</h2>
    <table class="table table-bordered align-middle">
        <thead class="table-dark">
            <tr>
                <th>Order No</th>
                <th>Customer Name</th>
                <th>Product Name</th>
                <th>Total Amount</th>
                <th>Order Status</th>
                <th>Payment Status</th>
                <th>Date</th>
                <th>ViewsDetails</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderNumber}"></td>
                <td th:text="${order.customerName}"></td>
                <td th:text="${order.productNames}"></td>
                <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
                <td>
                    <span class="badge bg-success" th:text="${order.orderStatus}"></span>
                </td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${order.paymentStatus}"></span>
                </td>
                <td th:text="${#dates.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
           		<td>
           			<form th:action="@{/details}" method="post">
           				<input type="hidden" name="orderId" th:value="${order.orderId}">
           				<button type="submit" class="btn btn-sm btn-primary">View Details</button>
           			</form>
				</td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="9" class="text-center text-muted">No order history found.</td>
        </tr>
        </tbody>
    </table>
     
</div>
</body>
</html>
