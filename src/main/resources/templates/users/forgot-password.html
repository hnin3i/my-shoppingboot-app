<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #222222;
            --card-dark: #1a1a1a;
            --input-bg: #2a2a2a;
            --border-color: #383838;
            --text-light: #f5f5f5;
            --accent-red: #e50010;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.2px;
        }
        .form-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
        }
        .auth-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
        }
        .form-control {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            padding: 0.75rem 0.85rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--text-light);
            color: var(--text-light);
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #666;
        }
        .btn-action {
            background-color: #ffffff;
            color: #222222;
            border-radius: 0 !important;
            padding: 0.85rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        /* Button loading & fade transitions */
		.btn-action, .auth-link, .btn-outline-action {
		    transition: opacity 0.25s ease, background-color 0.2s ease, color 0.2s ease;
		}
		.faded {
		    opacity: 0.35 !important;
		    pointer-events: none !important;
		}
		.btn-spinner {
		    display: inline-block;
		    width: 1rem;
		    height: 1rem;
		    border: 2px solid currentColor;
		    border-right-color: transparent;
		    border-radius: 50%;
		    animation: spinner-border 0.75s linear infinite;
		    vertical-align: -0.125em;
		    margin-right: 0.5rem;
		}
		@keyframes spinner-border {
		    to { transform: rotate(360deg); }
		}
        .btn-action:hover {
            background-color: var(--accent-red);
            color: #ffffff;
        }
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text-light);
        }
        .alert {
            border-radius: 0 !important;
            font-size: 0.85rem;
        }
        .auth-link {
            color: var(--text-light);
            font-weight: 600;
            text-decoration: underline;
        }
        .auth-link:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="form-title">Reset Password</div>
                <p class="small text-secondary mt-1">Enter your account email to receive an authorization code</p>
            </div>

            <div class="auth-card p-4">
                <div th:if="${error}" class="alert alert-danger py-2 text-center" th:text="${error}"></div>

                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-action w-100">Send Reset Code</button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-secondary">Remember your password?</span> <a th:href="@{/login}" class="auth-link">Back to Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const forgotForm = document.querySelector('form');
if (forgotForm) {
    forgotForm.addEventListener('submit', function() {
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span> Sending code...';

        // Fade out back link
        document.querySelectorAll('.auth-link').forEach(el => el.classList.add('faded'));
        this.submit();
    });
}
</script>

</body>
</html>
