<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - BLACKJACK Admin</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">

		<!-- Topbar -->
		<div class="admin-topbar">

			<div class="search-box">
				<i class="bi bi-search"></i> <input type="text"
					placeholder="Search user...">
			</div>

			<div class="admin-profile">
				<div class="admin-avatar">A</div>
				<div>
					<strong>Admin</strong>
				</div>
			</div>

		</div>


		<!-- Content -->
		<div class="admin-content">

			<!-- Flash messages -->
			<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>
					<div class="page-title">Users</div>
					<div class="page-subtitle">Manage registered users and their roles</div>
				</div>

			</div>


			<!-- User Card -->
			<div class="admin-card">

				<div class="d-flex justify-content-between align-items-center mb-3">

					<div class="admin-card-title mb-0">User List</div>

					<div>
						<input type="text" class="form-control"
							placeholder="Search user..." style="width: 220px;">
					</div>

				</div>


				<!-- Table -->
				<div class="table-responsive">

					<table class="admin-table">

						<thead>
							<tr>
								<th>Name</th>
								<th>Email</th>
								<th>Phone</th>
								<th>Role</th>
								<th>Joined</th>
								<th class="text-end">Action</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="user : ${users}">

								<td><strong th:text="${user.name}">Name</strong></td>

								<td th:text="${user.email}">email@example.com</td>

								<td th:text="${user.phone} ?: '-'">-</td>

								<td>
									<span class="status"
										th:classappend="${user.role.name() == 'ADMIN'} ? ' status-success' : ' status-warning'"
										th:text="${user.role}"> ROLE </span>
								</td>

								<td th:text="${user.created_at != null} ? ${user.created_at.toLocalDate()} : '-'">2026-01-01</td>

								<td class="text-end">

									<form th:action="@{'/admin/users/' + ${user.id} + '/role'}"
										method="post" class="d-inline-flex gap-1 justify-content-end">

										<select name="role" class="form-select form-select-sm"
											style="width: auto;">
											<option value="CUSTOMER"
												th:selected="${user.role.name() == 'CUSTOMER'}">Customer</option>
											<option value="ADMIN"
												th:selected="${user.role.name() == 'ADMIN'}">Admin</option>
										</select>

										<button type="submit" class="btn btn-sm btn-outline-secondary">
											<i class="bi bi-check-lg"></i>
										</button>

									</form>

								</td>
							</tr>

							<tr th:if="${#lists.isEmpty(users)}">
								<td colspan="6" class="text-center text-muted">No users found.</td>
							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
