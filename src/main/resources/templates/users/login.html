<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #222222;
            --card-dark: #1a1a1a;
            --input-bg: #2a2a2a;
            --border-color: #383838;
            --text-light: #f5f5f5;
            --text-muted: #9e9e9e;
            --accent-red: #e50010;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.2px;
        }
        .form-title {
            font-size: 1.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
        }
        .auth-card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-color);
        }
        .form-control {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            padding: 0.75rem 0.85rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--text-light);
            color: var(--text-light);
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #666;
        }
        .input-group .btn {
            border-radius: 0 !important;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-light);
        }
        .btn-action {
            background-color: #ffffff;
            color: #222222;
            border-radius: 0 !important;
            padding: 0.85rem;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .btn-action:hover {
            background-color: var(--accent-red);
            color: #ffffff;
        }
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--text-light);
        }
        
		.alert {
   			background-color: transparent !important;
    		border-radius: 0 !important;
    		font-size: 0.85rem;
    		letter-spacing: 0.5px;
		}

		.alert-success {
    		color: #4ade80 !important;
    		border: 1px solid #166534 !important;
		}

		.alert-danger {
    	color: var(--accent-red) !important;
    	border: 1px solid var(--accent-red) !important;
		}
        .auth-link {
            color: var(--text-light);
            font-weight: 600;
            text-decoration: underline;
        }
        .auth-link:hover {
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="form-title">Sign In</div>
                <p class="small text-secondary mt-1">Access your member account and orders</p>
            </div>

            <div class="auth-card p-4">
                <div th:if="${param.verified}" class="alert alert-success py-2 text-center">
                    Account verified. Please sign in below.
                </div>
                <div th:if="${param.resetSuccess}" class="alert alert-success py-2 text-center">
                    Password updated. Please sign in.
                </div>
                <div th:if="${error}" class="alert alert-danger py-2 text-center" th:text="${error}"></div>

                <form th:action="@{/login}" th:object="${user}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label mb-0">Password</label>
                            <a th:href="@{/forgot-password}" class="auth-link small text-decoration-none">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', 'loginIcon')">
                                <i id="loginIcon" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-action w-100">Sign In</button>
                </form>

                <div class="text-center mt-4 small">
                    <span class="text-secondary">Not a member yet?</span> <a th:href="@{/register}" class="auth-link">Sign up</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>

</body>
</html>
