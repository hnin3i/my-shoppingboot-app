<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org"

    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

    layout:decorate="~{layouts/public_layout}">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title

    th:text="${product != null

        ? product.name + ' - BLACKJACK'

        : 'Product Detail - BLACKJACK'}">

    Product Detail - BLACKJACK</title>

<!-- Bootstrap -->

<link

    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    rel="stylesheet">

<!-- Bootstrap Icons -->

<link

    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"

    rel="stylesheet">

<!-- Product Detail CSS -->

<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/product-detail.css}">


</head>
<body>

    <div layout:fragment="content">
<main class="product-detail-page">

    		<div class="container-fluid px-3 px-lg-5">

    			<div class="row product-detail-wrapper">


    				<!-- ================================================= -->

    				<!-- LEFT : PRODUCT IMAGE -->

    				<!-- ================================================= -->

    				<div class="col-lg-7 product-gallery">

    					<div class="main-product-image">

    						<img id="productImage"

    							th:src="@{'/images/product/' + ${product.image}}"

    							th:alt="${product != null

                                ? product.name

                                : 'BLACKJACK Product'}"

    							class="img-fluid rounded"

    							style="width: 100%; height: 100%; object-fit: contain;">

    					</div>


    				</div>


    				<!-- ================================================= -->

    				<!-- RIGHT : PRODUCT INFORMATION -->

    				<!-- ================================================= -->

    				<div class="col-lg-5 product-information">

    					<div class="product-info-inner">


    						<!-- ================= PRODUCT NAME ================= -->

    						<div class="product-title-row">

    							<div>

    								<h1

    									th:text="${product != null

                                    ? product.name

                                    : 'Product'}">

    									Product</h1>
    								

    							</div>

    						</div>


    						<!-- ================= PRICE ================= -->

    						<!-- NORMAL PRICE -->

    						<div class="product-price"

    							th:if="${product != null

                                and product.isDiscount != 1}">

    							<span

    								th:text="${#numbers.formatDecimal( product.price, 0,'COMMA', 0, 'POINT' ) + ' MMK'}">

    								0 MMK </span>

    						</div>


    						<!-- DISCOUNT PRICE -->

    						<div class="product-price discount-price"

    							th:if="${product != null

                                and product.isDiscount == 1}">

    							<span class="old-price"> <del

    									th:text="${#numbers.formatDecimal(product.price, 0,'COMMA', 0, 'POINT' ) + ' MMK'}">

    									0 MMK </del>

    							</span> <span class="sale-price"

    								th:text="${#numbers.formatDecimal(

                                      product.finalPrice,

                                      0,

                                      'COMMA',

                                      0,

                                      'POINT'

                                  ) + ' MMK'}">

    								0 MMK </span>

    						</div>


    						<!-- ================================================= -->

    						<!-- COLOR -->

    						<!-- ================================================= -->

    						<div class="product-option">

    							<div class="option-title">

    								COLOR: <span id="selectedColor"> Please select </span>

    							</div>


    							<!--

                                product.js will create color buttons

                                from DETAIL_PRODUCT.stocks

                            -->

    							<div class="color-options" id="colorOptions"></div>

    						</div>


    						<!-- ================================================= -->

    						<!-- SIZE -->

    						<!-- ================================================= -->

    						<section class="product-option size-section">

    							<div class="option-heading">

    								<span>SIZE</span>

    							</div>


    							<!--

                                product.js will create size buttons

                                from DETAIL_PRODUCT.stocks

                            -->

    							<div class="size-options" id="sizeOptions"></div>


    							<div class="size-message" id="sizeMessage">

    								<i class="bi bi-info-circle"></i> Please select a size

    							</div>

    						</section>


    						<!-- ================================================= -->

    						<!-- QUANTITY -->

    						<!-- ================================================= -->

    						<div class="product-option quantity-section">

    							<div class="option-heading">

    								<span>Quantity</span>

    							</div>

    							<div class="quantity-control">

    								<button type="button" class="quantity-btn"

    									id="decreaseQuantity" aria-label="Decrease quantity">

    									<i class="bi bi-dash"></i>

    								</button>

    								<input type="number" id="quantity" name="quantity" value="1"

    									min="1" max="20" step="1" inputmode="numeric">

    								<button type="button" class="quantity-btn"

    									id="increaseQuantity" aria-label="Increase quantity">

    									<i class="bi bi-plus"></i>

    								</button>

    							</div>

    						</div>

    						<!-- SHOPPING ACTIONS -->

    						<!-- Guest and Customer -->

    						<div class="product-actions"

    							th:if="${session.loggedInUser == null

             or (#strings.toUpperCase(session.loggedInUser.role) != 'ADMIN'
              and #strings.toUpperCase(session.loggedInUser.role) != 'SUPER_ADMIN')}">

    							<button class="add-to-cart-btn" id="addToCartBtn" type="button">

    								<i class="bi bi-bag"></i> <span>ADD TO CART</span>

    							</button>
    						</div>

    						<!-- Admin Only -->

    						<div class="admin-shopping-notice"

    							th:if="${session.loggedInUser != null

             and (#strings.toUpperCase(session.loggedInUser.role) == 'ADMIN'
             or #strings.toUpperCase(session.loggedInUser.role) == 'SUPER_ADMIN')}">

    							<i class="bi bi-shield-lock"></i>

    							<div>

    								<strong>Shopping Unavailable</strong>

    								<p>Admin accounts cannot place orders.</p>

    							</div>

    						</div>

    						<!-- ================= DESCRIPTION ================= -->

    						<!-- ================= DESCRIPTION ACCORDION ================= -->

    						<!-- ================= DESCRIPTION ACCORDION ================= -->

    						<div class="product-description-accordion mt-4">

    							<div class="accordion-item border-top border-bottom py-2">

    								<button

    									class="accordion-trigger d-flex justify-content-between align-items-center w-100 bg-transparent border-0 px-0 py-2 text-start fw-semibold fs-6"

    									type="button" data-bs-toggle="collapse"

    									data-bs-target="#descriptionCollapse" aria-expanded="false"

    									aria-controls="descriptionCollapse">

    									<span>PRODUCT DESCRIPTION</span> <span class="accordion-icon"></span>

    								</button>

    								<div id="descriptionCollapse" class="collapse mt-2">

    									<p class="description-text mb-2 text-muted"

    										th:if="${product != null and product.description != null}"

    										th:text="${product.description}">Product

    										description[cite: 2]</p>

    								</div>

    							</div>

    						</div>

    					</div>

    				</div>

    			</div>

    		</div>

    		<!-- ================= ADD TO CART POPUP MODAL ================= -->

<div id="addToCartModal" class="cart-modal-overlay" style="display: none;">

    <div class="cart-modal-content">

        <!-- Close / X Button -->

        <button type="button" class="cart-modal-close" id="closeCartModal" aria-label="Close modal">

            <i class="bi bi-x"></i>

        </button>

        <h2 class="cart-modal-title">Item Added To Bag</h2>

        <div class="cart-modal-body">

            <!-- Product Image -->

            <div class="cart-modal-img-wrapper">

                <img id="modalProductImg" src="" alt="Product Image" class="img-fluid">

            </div>

            <!-- Product Details -->

            <div class="cart-modal-info">

                <h3 id="modalProductName">Product Name</h3>

                <p class="cart-modal-variant">Color: <span id="modalProductColor"></span> | Size: <span id="modalProductSize"></span></p>

                <p class="cart-modal-qty">Qty: <span id="modalProductQty">1</span></p>

                <p class="cart-modal-price" id="modalProductPrice">$0.00</p>

            </div>

        </div>

        <!-- Action Buttons -->

        <div class="cart-modal-actions">

            <a href="/cart" class="btn-go-to-bag">Go to Bag</a>

            <button type="button" class="btn-continue-shopping" id="continueShoppingBtn">Continue Shopping</button>

        </div>

    </div>

</div>

    	</main>


    	<!-- ================================================= -->

    	<!-- PRODUCT DATA FROM SPRING BOOT -->

    	<!-- ================================================= -->

    	<script th:inline="javascript">

    		const DETAIL_PRODUCT = {

    			productId : /*[[${product != null ? product.id : null}]]*/null,

    			productName : /*[[${product != null ? product.name : ''}]]*/"",

    			image : /*[[${product != null ? '/images/product/' + product.image : ''}]]*/"",

    			price : /*[[${product != null

    												               ? (product.isDiscount == 1 ? product.finalPrice : product.price)

    												               : 0}]]*/0,

    			stocks : /*[[${stocks != null ? stocks : {}}]]*/[]

    		};

    	</script>


    	<!-- ================================================= -->

    	<!-- JAVASCRIPT FILES -->

    	<!-- ================================================= -->

    	<script th:src="@{/js/storage.js}"></script>

    	<script th:src="@{/js/cart.js}"></script>

    	<script th:src="@{/js/product.js}"></script>


    </div>


</body>

</html>
