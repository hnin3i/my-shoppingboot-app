
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public_layout}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${product != null
        ? product.name + ' - BLACKJACK'
        : 'Product Detail - BLACKJACK'}">
        Product Detail - BLACKJACK
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Product Detail CSS -->
    <link rel="stylesheet"
          th:href="@{/css/product-detail.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>

<style>

    /* ================= QUANTITY ================= */

    .quantity-section {
        background: #f5f5f5;
    }

    .quantity-control {
        display: flex;
        align-items: center;
        width: 150px;
        height: 48px;
        border: 1px solid #ccc;
    }

    .quantity-btn {
        width: 48px;
        height: 100%;
        border: none;
        background: #fff;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .quantity-btn:hover {
        background: #f5f5f5;
    }

    #quantity {
        flex: 1;
        width: 50px;
        height: 100%;
        border: none;
        outline: none;
        text-align: center;
        font-size: 16px;
    }

    #quantity::-webkit-inner-spin-button,
    #quantity::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    #quantity[type="number"] {
        -moz-appearance: textfield;
    }

    /* ================= PRICE ================= */

    .old-price {
        text-decoration: line-through !important;
        color: #888;
        margin-right: 10px;
    }

    .sale-price {
        color: #d63384;
        font-weight: 600;
    }

</style>


<body>

<div layout:fragment="content">

    <main class="product-detail-page">

        <div class="container-fluid px-3 px-lg-5">

            <div class="row product-detail-wrapper">


                <!-- ================================================= -->
                <!-- LEFT : PRODUCT IMAGE -->
                <!-- ================================================= -->

                <div class="col-lg-7 product-gallery">

                    <div class="main-product-image">

                        <img id="productImage"
                             th:src="@{'/images/product/' + ${product.image}}"
                             th:alt="${product != null
                                ? product.name
                                : 'BLACKJACK Product'}"
                             class="img-fluid rounded"
                             style="width: 100%;
                                    height: 100%;
                                    object-fit: contain;">

                    </div>


                    <!-- Wishlist -->

                    <button class="image-wishlist"
                            type="button"
                            aria-label="Add to wishlist">

                        <i class="bi bi-heart"></i>

                    </button>

                </div>


                <!-- ================================================= -->
                <!-- RIGHT : PRODUCT INFORMATION -->
                <!-- ================================================= -->

                <div class="col-lg-5 product-information">

                    <div class="product-info-inner">


                        <!-- ================= PRODUCT NAME ================= -->

                        <div class="product-title-row">

                            <div>

                                <h1 th:text="${product != null
                                    ? product.name
                                    : 'Product'}">
                                    Product
                                </h1>

                                <div class="product-code">
                                    Product No.
                                </div>

                            </div>

                        </div>


                        <!-- ================= PRICE ================= -->

                        <!-- NORMAL PRICE -->

                        <div class="product-price"
                             th:if="${product != null
                                and product.isDiscount != 1}">

                            <span
                                th:text="${#numbers.formatDecimal( product.price, 0,'COMMA', 0, 'POINT' ) + ' MMK'}">

                                0 MMK

                            </span>

                        </div>


                        <!-- DISCOUNT PRICE -->

                        <div class="product-price discount-price"
                             th:if="${product != null
                                and product.isDiscount == 1}">

                            <span class="old-price">

                                <del th:text="${#numbers.formatDecimal(product.price, 0,'COMMA', 0, 'POINT' ) + ' MMK'}">

                                    0 MMK

                                </del>

                            </span>


                            <span class="sale-price"
                                  th:text="${#numbers.formatDecimal(
                                      product.finalPrice,
                                      0,
                                      'COMMA',
                                      0,
                                      'POINT'
                                  ) + ' MMK'}">

                                0 MMK

                            </span>

                        </div>


                        <!-- ================= DESCRIPTION ================= -->

                        <div class="product-description">

                            <p th:if="${product != null
                                and product.description != null}"
                               th:text="${product.description}">

                                Product description

                            </p>

                        </div>


                        <!-- ================================================= -->
                        <!-- COLOR -->
                        <!-- ================================================= -->

                        <div class="product-option">

                            <div class="option-title">

                                COLOR:

                                <span id="selectedColor">
                                    Please select
                                </span>

                            </div>


                            <!--
                                product.js will create color buttons
                                from DETAIL_PRODUCT.stocks
                            -->

                            <div class="color-options"
                                 id="colorOptions">

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- SIZE -->
                        <!-- ================================================= -->

                        <section class="product-option size-section">

                            <div class="option-heading">
                                <span>SIZE</span>
                            </div>


                            <!--
                                product.js will create size buttons
                                from DETAIL_PRODUCT.stocks
                            -->

                            <div class="size-options"
                                 id="sizeOptions">

                            </div>


                            <div class="size-message"
                                 id="sizeMessage">

                                <i class="bi bi-info-circle"></i>

                                Please select a size

                            </div>

                        </section>


                        <!-- ================================================= -->
                        <!-- QUANTITY -->
                        <!-- ================================================= -->

                        <div class="product-option quantity-section">

                            <div class="option-heading">

                                <span>QUANTITY</span>

                            </div>


                            <div class="quantity-control">


                                <!-- DECREASE -->

                                <button type="button"
                                        class="quantity-btn"
                                        id="decreaseQuantity"
                                        aria-label="Decrease quantity">

                                    <i class="bi bi-dash"></i>

                                </button>


                                <!-- QUANTITY INPUT -->

                                <input type="number"
                                       id="quantity"
                                       name="quantity"
                                       value="1"
                                       min="1"
                                       max="20"
                                       step="1"
                                       inputmode="numeric">


                                <!-- INCREASE -->

                                <button type="button"
                                        class="quantity-btn"
                                        id="increaseQuantity"
                                        aria-label="Increase quantity">

                                    <i class="bi bi-plus"></i>

                                </button>

                            </div>

                        </div>


                        <!-- ================================================= -->
                        <!-- ADD TO CART -->
                        <!-- ================================================= -->

                        <div class="product-actions">


                            <button class="add-to-cart-btn"
                                    id="addToCartBtn"
                                    type="button">

                                <i class="bi bi-bag"></i>

                                <span>
                                    ADD TO CART
                                </span>

                            </button>


                            <button class="buy-now-btn"
                                    type="button">

                                BUY NOW

                            </button>

                        </div>


                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- ================================================= -->
    <!-- PRODUCT DATA FROM SPRING BOOT -->
    <!-- ================================================= -->

    <script th:inline="javascript">

        const DETAIL_PRODUCT = {
            productId: /*[[${product != null ? product.id : null}]]*/ null,
            productName: /*[[${product != null ? product.name : ''}]]*/ "",
            image: /*[[${product != null ? '/images/product/' + product.image : ''}]]*/ "",
            price: /*[[${product != null
                ? (product.isDiscount == 1 ? product.finalPrice : product.price)
                : 0}]]*/ 0,
            stocks: /*[[${stocks != null ? stocks : {}}]]*/ []
        };

    </script>


    <!-- ================================================= -->
    <!-- JAVASCRIPT FILES -->
    <!-- ================================================= -->

    <script th:src="@{/js/storage.js}"></script>

    <script th:src="@{/js/cart.js}"></script>

    <script th:src="@{/js/product.js}"></script>


</div>

</body>

</html>
