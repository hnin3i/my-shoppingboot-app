<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layouts/public_layout}">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title th:text="${pageTitle != null ? pageTitle : 'All Products'}">
	Products</title>

<link rel="stylesheet" th:href="@{/css/products.css}">

</head>

<body>

<div layout:fragment="content">

		


		<!-- PRODUCTS PAGE -->
		<main class="products-page">


			<!-- PAGE TITLE -->
			<section class="products-heading">


				<h1 th:text="${pageTitle != null ? pageTitle : 'ALL PRODUCTS'}">
					ALL PRODUCTS</h1>
				
				<p class="eyebrow"
					th:text="${pageSubtitle != null ? pageSubtitle : 'SHOP'}">SHOP
				</p>

			</section>


			<!-- PRODUCT TOOLBAR -->
			<section class="products-toolbar">

				<div class="product-count">

					<span th:text="${products != null ? #lists.size(products) : 0}">
						0 </span> PRODUCTS

				</div>


				<div class="product-sort">

					<label for="sort"> SORT BY </label> <select id="sort" name="sort"
						onchange="changeSort(this.value)">

						<option value="newest">Newest</option>

						<option value="price-low">Price: Low to High</option>

						<option value="price-high">Price: High to Low</option>

					</select>

				</div>

			</section>


			<!-- PRODUCT GRID -->
			<section class="product-grid" id="productGrid">


				<article class="product-card" th:each="product : ${products}"
					th:if="${product.isActive == 1}"
					th:attr="
                        data-price=${product.isDiscount == 1 ? product.finalPrice : product.price},
                        data-created=${product.createdAt}">


					<!-- PRODUCT IMAGE -->
					<a class="product-image"
						th:href="@{/products/detail/{id}(id=${product.id})}"> <img
						th:src="@{'/images/product/' + ${product.image}}"
						th:alt="${product.name}" class="img-fluid rounded"
						style="width: 100%; height: 100%; object-fit: cover;">

					</a>


					<!-- PRODUCT INFO -->
					<div class="product-info">


						<!-- PRODUCT NAME -->
						<h2 class="product-name" th:text="${product.name}">Wide-Leg
							Regular-Waist Jeans</h2>


						<!-- NORMAL PRICE -->
						<div class="product-price" th:if="${product.isDiscount != 1}">

							<span
								th:text="${#numbers.formatDecimal(
                                product.price,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            ) + ' MMK'}">

								45,000 MMK </span>

</div>


						<!-- DISCOUNT PRICE -->
						<div class="product-price discount-price"
							th:if="${product.isDiscount == 1}">


							<!-- ORIGINAL PRICE -->
							<del class="old-price"
								th:text="${#numbers.formatDecimal(
                                 product.price,
                                 0,
                                 'COMMA',
                                 0,
                                 'POINT'
                             ) + ' MMK'}">

								50,000 MMK </del>


							<!-- SALE PRICE -->
							<span class="sale-price" style="color: red !important;"
								th:text="${#numbers.formatDecimal(
                                  product.finalPrice,
                                  0,
                                  'COMMA',
                                  0,
                                  'POINT'
                              ) + ' MMK'}">

								45,000 MMK </span>

						</div>

					</div>

				</article>


			</section>


			<!-- EMPTY PRODUCTS -->
			<section class="empty-products"
				th:if="${products == null or products.isEmpty()}">

				<h2>No products found</h2>

				<p>There are no products available.</p>

				<a th:href="@{/products/list}"> VIEW ALL PRODUCTS </a>

			</section>


			<!-- PAGINATION -->
			<nav class="pagination"
				th:if="${products != null and !products.isEmpty()}">

				<a href="#" class="page-arrow"> ‹ </a> <a href="#"
					class="page-number active"> 1 </a> <a href="#" class="page-number">
					2 </a> <a href="#" class="page-number"> 3 </a> <span class="page-dots">
					... </span> <a href="#" class="page-number"> 19 </a> <a href="#"
					class="page-arrow"> › </a>

			</nav>


		</main>

	</div>

<script>
			function changeSort(value) {

				const productGrid = document.getElementById("productGrid");

				if (!productGrid) {
					return;
				}

				const productCards = Array.from(productGrid
						.querySelectorAll(".product-card"));

				if (value === "price-low") {

					productCards
							.sort(function(a, b) {

								const priceA = Number(a
										.getAttribute("data-price")) || 0;

								const priceB = Number(b
										.getAttribute("data-price")) || 0;

								return priceA - priceB;
							});

				} else if (value === "price-high") {

					productCards
							.sort(function(a, b) {

								const priceA = Number(a
										.getAttribute("data-price")) || 0;

								const priceB = Number(b
										.getAttribute("data-price")) || 0;

								return priceB - priceA;
							});

				} else if (value === "newest") {

					productCards.sort(function(a, b) {

						const dateA = new Date(a.getAttribute("data-created"));

						const dateB = new Date(b.getAttribute("data-created"));

						return dateB - dateA;
					});
				}

				productCards.forEach(function(card) {
					productGrid.appendChild(card);
				});
			}
		</script>
</body>

</html>
