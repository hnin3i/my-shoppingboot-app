<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/public_layout}">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title
	th:text="${selectedCategory != null
                     ? selectedCategory.name
                     : 'All Products'}">
	Products</title>

<link rel="stylesheet" th:href="@{/css/products.css}">
</head>

<body>

	<div layout:fragment="content">

		<!-- PRODUCTS PAGE -->
		<main class="products-page">
			<!-- PAGE TITLE -->
			<section class="products-heading">

				<h1
					th:text="${categoryName != null ? categoryName : 'ALL PRODUCTS'}">
					WOMEN</h1>

			</section>


			<!-- PRODUCT TOOLBAR -->
			<section class="products-toolbar">

				<div class="product-count">

					<span th:text="${productCount}"> 24 </span> PRODUCTS

				</div>

				<div class="product-sort">

					<label for="sort"> SORT BY </label> <select id="sort" name="sort"
						onchange="changeSort(this.value)">

						<option value="newest">Newest</option>

						<option value="price-low">Price: Low to High</option>

						<option value="price-high">Price: High to Low</option>

					</select>

				</div>

			</section>


			<!-- PRODUCT GRID -->
			<section class="product-grid">

				<article class="product-card" th:each="product : ${products}">

					<a class="product-image"
						th:href="@{/products/{id}(id=${product.id})}"> <img
						th:src="@{${product.image}}" th:alt="${product.name}">

						<!-- <button type="button" class="wishlist-btn"
							aria-label="Add to wishlist" onclick="event.preventDefault();">
							♡</button> -->

					</a>


					<!-- PRODUCT INFO -->
					<div class="product-info">

						<h2 class="product-name" th:text="${product.name}">Wide-Leg
							Regular-Waist Jeans</h2>


						<!-- NORMAL PRICE -->
						<div class="product-price"
							th:if="${product.discount == null or product.discount <= 0}">

							<span th:text="${product.price}"> 45000 MMK </span>

						</div>


						<!-- DISCOUNT PRICE -->
						<div class="product-price discount-price"
							th:if="${product.discount != null and product.discount > 0}">

							<span class="old-price" th:text="${product.price}"> 50000
								MMK </span> <span class="sale-price" th:text="${product.discountPrice}">
								45000 MMK </span>

						</div>

					</div>

				</article>

			</section>


			<!-- EMPTY PRODUCTS -->
			<section class="empty-products"
				th:if="${products == null or products.isEmpty()}">

				<h2>No products found</h2>

				<p>There are no products available.</p>

				<a th:href="@{/products}"> VIEW ALL PRODUCTS </a>

			</section>


			<!-- PAGINATION -->
			<nav class="pagination"
				th:if="${products != null and !products.isEmpty()}">

				<a href="#" class="page-arrow"> ‹ </a> <a href="#"
					class="page-number active"> 1 </a> <a href="#" class="page-number">
					2 </a> <a href="#" class="page-number"> 3 </a> <span class="page-dots">
					... </span> <a href="#" class="page-number"> 19 </a> <a href="#"
					class="page-arrow"> › </a>

			</nav>

		</main>

	</div>


	<script>
		function changeSort(value) {

			const url = new URL(window.location.href);

			url.searchParams.set("sort", value);

			window.location.href = url.toString();
		}
	</script>

</body>
</html>
