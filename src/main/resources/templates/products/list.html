<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public_layout}">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${selectedCategory != null
                     ? selectedCategory.name
                     : 'All Products'}">
        Products
    </title>

    <link rel="stylesheet" th:href="@{/css/products.css}">

</head>

<body>

<div layout:fragment="content">

    <!-- PRODUCTS PAGE -->
    <main class="products-page">

        <!-- PAGE TITLE -->
        <section class="products-heading">

            <h1 th:text="${categoryName != null
                          ? categoryName
                          : 'ALL PRODUCTS'}">
                WOMEN
            </h1>

        </section>


        <!-- PRODUCT TOOLBAR -->
        <section class="products-toolbar">

            <div class="product-count">

                <span th:text="${productCount}">
                    24
                </span>

                PRODUCTS

            </div>


            <div class="product-sort">

                <label for="sort">
                    SORT BY
                </label>

                <select id="sort"
                        name="sort"
                        onchange="changeSort(this.value)">

                    <option value="newest">
                        Newest
                    </option>

                    <option value="price-low">
                        Price: Low to High
                    </option>

                    <option value="price-high">
                        Price: High to Low
                    </option>

                </select>

            </div>

        </section>


        <!-- PRODUCT GRID -->
        <section class="product-grid"
                 id="productGrid">

            <article class="product-card"
                     th:each="product : ${products}"
                     th:attr="data-price=${product.isDiscount == 1
                             ? product.finalPrice
                             : product.price},
            data-created=${product.createdAt}">

                <!-- PRODUCT IMAGE -->

                <a class="product-image"
                   th:href="@{/products/detail/{id}(id=${product.id})}">

                    <img th:src="@{'/images/product/' + ${product.image}}"
                         th:alt="${product.name}"
                         class="img-fluid rounded"
                         style="width: 100%;
                                height: 100%;
                                object-fit: cover;">

                </a>


                <!-- PRODUCT INFO -->

                <div class="product-info">

                    <!-- PRODUCT NAME -->

                    <h2 class="product-name"
                        th:text="${product.name}">

                        Wide-Leg Regular-Waist Jeans

                    </h2>


                    <!-- NORMAL PRICE -->

                    <div class="product-price"
                         th:if="${product.isDiscount != 1}">

                        <span th:text="${#numbers.formatDecimal(
                                product.price,
                                0,
                                'COMMA',
                                0,
                                'POINT'
                            ) + ' MMK'}">

                            45,000 MMK

                        </span>

                    </div>


                    <!-- DISCOUNT PRICE -->

                    <div class="product-price discount-price"
                         th:if="${product.isDiscount == 1}">

                        <span class="old-price"
                              th:text="${#numbers.formatDecimal(
                                  product.price,
                                  0,
                                  'COMMA',
                                  0,
                                  'POINT'
                              ) + ' MMK'}">

                            50,000 MMK

                        </span>


                        <span class="sale-price"
                              th:text="${#numbers.formatDecimal(
                                  product.finalPrice,
                                  0,
                                  'COMMA',
                                  0,
                                  'POINT'
                              ) + ' MMK'}">

                            45,000 MMK

                        </span>

                    </div>

                </div>

            </article>

        </section>


        <!-- EMPTY PRODUCTS -->

        <section class="empty-products"
                 th:if="${products == null or products.isEmpty()}">

            <h2>
                No products found
            </h2>

            <p>
                There are no products available.
            </p>

            <a th:href="@{/products}">
                VIEW ALL PRODUCTS
            </a>

        </section>


        <!-- PAGINATION -->

        <nav class="pagination"
             th:if="${products != null and !products.isEmpty()}">

            <a href="#"
               class="page-arrow">
                ‹
            </a>

            <a href="#"
               class="page-number active">
                1
            </a>

            <a href="#"
               class="page-number">
                2
            </a>

            <a href="#"
               class="page-number">
                3
            </a>

            <span class="page-dots">
                ...
            </span>

            <a href="#"
               class="page-number">
                19
            </a>

            <a href="#"
               class="page-arrow">
                ›
            </a>

        </nav>

    </main>

</div>


<script th:inline="javascript">

    // Products from Thymeleaf
    let products = /*[[${products}]]*/ [];


    function changeSort(value) {

        const productGrid =
            document.getElementById("productGrid");

        const productCards =
            Array.from(
                productGrid.querySelectorAll(".product-card")
            );


        // LOW TO HIGH
        if (value === "price-low") {

            productCards.sort(function(a, b) {

                const priceA =
                    parseFloat(a.dataset.price);

                const priceB =
                    parseFloat(b.dataset.price);

                return priceA - priceB;

            });

        }


        // HIGH TO LOW
        else if (value === "price-high") {

            productCards.sort(function(a, b) {

                const priceA =
                    parseFloat(a.dataset.price);

                const priceB =
                    parseFloat(b.dataset.price);

                return priceB - priceA;

            });

        }


        // NEWEST
        else if (value === "newest") {

            productCards.sort(function(a, b) {

                const dateA =
                    new Date(a.dataset.created);

                const dateB =
                    new Date(b.dataset.created);

                return dateB - dateA;
            });
        }


        // Put sorted cards back into product grid

        productCards.forEach(function(card) {

            productGrid.appendChild(card);

        });

    }

</script>

</body>

</html>
