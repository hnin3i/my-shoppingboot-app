<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Demo - Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="./index.html">🛍️ ShopDemo</a>
    <a class="btn btn-outline-warning btn-sm position-relative" href="/cart">
        🛒 Cart
        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger badge-cart">0</span>
    </a>
</nav>

<main class="container">
    <h5 class="mb-3 text-muted">🛒 Your Cart</h5>
    <div id="cart-container"></div>

    <div class="text-end mt-3">
        <button class="btn btn-success" type="button" data-cart-action="checkout" >
            Proceed to Checkout →
        </button>
    </div>
</main>

<div id="toast-msg" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
        <div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/product.js"></script>
<script src="/js/api.js"></script>
<script src="/js/checkout.js"></script>
<script src="/js/error-handler.js"></script>
<script src="/js/cart-app.js"></script>
</body>
</html>
