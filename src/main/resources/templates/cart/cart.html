<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/public_layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Demo - Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
    /*<![CDATA[*/
        .cart-header-title {
            font-size: 2.25rem;
            font-weight: 500;
            letter-spacing: -0.5px;
        }
        .cart-grid-header {
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            color: #555;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid #e5e5e5;
        }
        .cart-item-row {
            padding: 1.25rem 0;
            border-bottom: 1px solid #eee;
        }
        .product-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            background-color: #f7f7f7;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .product-title {
            font-weight: 600;
            font-size: 1rem;
            color: #000;
            margin-bottom: 2px;
        }
        .product-variant {
            color: #777;
            font-size: 0.875rem;
        }
        .qty-pill-input {
            border: 1px solid #dcdcdc;
            border-radius: 50px;
            padding: 4px 12px;
            display: inline-flex;
            align-items: center;
            background: #fff;
        }
        .qty-pill-btn {
            border: none;
            background: transparent;
            font-size: 1rem;
            color: #333;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .qty-pill-btn:hover {
            opacity: 0.6;
        }
        .btn-checkout-black {
            background-color: #000;
            color: #fff;
            border-radius: 50px;
            padding: 12px 36px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-checkout-black:hover {
            background-color: #222;
            color: #fff;
        }
        .clear-cart-link {
            color: #000;
            text-decoration: underline;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .clear-cart-link:hover {
            color: #555;
        }
        .btn-remove-icon {
            border: none;
            background: transparent;
            font-size: 1.15rem;
            color: #222;
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .btn-remove-icon:hover {
            color: #dc3545;
            transform: scale(1.1);
        }
    /*]]>*/
    </style>
</head>
<body>
<div layout:fragment="content">
    <main class="container my-5">
        <h1 class="cart-header-title mb-4">Your Bag</h1>
        
        <div id="cart-container"></div>
    </main>
</div>

<div id="toast-msg" class="toast align-items-center border-0 position-fixed bottom-0 end-0 m-3" role="alert">
    <div class="d-flex">
        <div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/storage.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/product.js"></script>
<script src="/js/api.js"></script>
<script src="/js/checkout.js"></script>
<script src="/js/error-handler.js"></script>
</body>
</html>
