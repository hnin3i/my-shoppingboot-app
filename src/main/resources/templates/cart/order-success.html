<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="./index.html">🛍️ ShopDemo</a>
</nav>

<main class="container text-center py-5">
    <div class="display-1">🎉</div>
    <h3 class="mt-3">Order Placed Successfully!</h3>
    <p class="text-muted" id="success-msg"></p>
    <a class="btn btn-primary mt-3" href="./index.html">Continue Shopping</a>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderNumber = params.get("orderNumber");
    document.getElementById("success-msg").textContent = orderNumber
        ? `Your order number is ${orderNumber}.`
        : "Your order has been received.";
</script>
</body>
</html>
