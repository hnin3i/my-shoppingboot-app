<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Demo – Add to Cart & Order</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .product-card { transition: transform .2s; }
        .product-card:hover { transform: translateY(-4px); }
        .badge-cart { font-size: .7rem; }
        #toast-msg {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 9999; min-width: 260px;
        }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     NAVBAR
═══════════════════════════════════════════════════ -->
<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <span class="navbar-brand">🛍️ ShopDemo</span>
    <div class="d-flex gap-3">
        <button class="btn btn-outline-light btn-sm" onclick="showPage('products')">Products</button>
        <button class="btn btn-outline-warning btn-sm position-relative" onclick="showPage('cart')">
            🛒 Cart
            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle
                  badge rounded-pill bg-danger badge-cart">0</span>
        </button>
    </div>
</nav>

<!-- ═══════════════════════════════════════════════════
     PAGE 1 – PRODUCT LIST
     (Simulates data from: products + stocks tables)
═══════════════════════════════════════════════════ -->
<div id="page-products" class="page active container">
    <h5 class="mb-3 text-muted">Available Products</h5>
    <div class="row g-3" id="product-grid"></div>
</div>

<!-- ═══════════════════════════════════════════════════
     PAGE 2 – CART
═══════════════════════════════════════════════════ -->
<div id="page-cart" class="page container">
    <h5 class="mb-3 text-muted">🛒 Your Cart</h5>
    <div id="cart-container"></div>
    <div class="text-end mt-3">
        <button class="btn btn-success" onclick="showPage('checkout')">
            Proceed to Checkout →
        </button>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════
     PAGE 3 – CHECKOUT
═══════════════════════════════════════════════════ -->
<div id="page-checkout" class="page container">
    <div class="row g-4">

        <!-- Checkout Form -->
        <div class="col-md-7">
            <div class="card p-4">
                <h5 class="mb-3">Shipping Details</h5>
                <div class="mb-3">
                    <label class="form-label">Full Shipping Address</label>
                    <textarea id="shipping-address" class="form-control" rows="2"
                              placeholder="No.123, Main Street, Yangon"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input id="phone-no" type="text" class="form-control"
                           placeholder="09-XXXXXXXXX">
                </div>
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select id="payment-method" class="form-select">
                        <option value="">-- Select --</option>
                        <option value="Cash on Delivery">Cash on Delivery</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
                <div id="checkout-alert"></div>
                <button id="place-order-btn" class="btn btn-primary w-100"
                        onclick="placeOrder()">
                    Place Order
                </button>
            </div>
        </div>

        <!-- Order Summary Panel -->
        <div class="col-md-5">
            <div class="card p-4">
                <h6 class="mb-3 fw-bold">Order Summary</h6>
                <div id="order-summary-items"></div>
                <hr>
                <div class="d-flex justify-content-between fw-bold">
                    <span>Grand Total</span>
                    <span id="order-grand-total">0 MMK</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════
     PAGE 4 – ORDER SUCCESS
═══════════════════════════════════════════════════ -->
<div id="page-success" class="page container text-center py-5">
    <div class="display-1">🎉</div>
    <h3 class="mt-3">Order Placed Successfully!</h3>
    <p class="text-muted" id="success-msg"></p>
    <button class="btn btn-primary mt-3" onclick="showPage('products')">
        Continue Shopping
    </button>
</div>

<!-- Toast Notification -->
<div id="toast-msg" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
        <div class="toast-body" id="toast-body"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 <script src="/js/shopping-cart.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   MOCK DATA
   In real app, this comes from Thymeleaf (th:data-*) or a
   GET /api/products endpoint. Mirrors your ERD:
     products: id, name, price, image, category_id
     stocks:   id, product_id, colour, size, stock_qty
═══════════════════════════════════════════════════════════════ */
const MOCK_PRODUCTS = [
    {
        productId:   "prod-001",
        productName: "Classic T-Shirt",
        image:       "https://via.placeholder.com/150/FF6B6B/fff?text=T-Shirt",
        price:       15000,
        stocks: [
            { stockId: "stk-001a", colour: "Red",  size: "M", stock_qty: 10 },
            { stockId: "stk-001b", colour: "Blue", size: "L", stock_qty:  5 },
        ]
    },
    {
        productId:   "prod-002",
        productName: "Denim Jeans",
        image:       "https://via.placeholder.com/150/4ECDC4/fff?text=Jeans",
        price:       35000,
        stocks: [
            { stockId: "stk-002a", colour: "Dark Blue", size: "32", stock_qty: 8 },
            { stockId: "stk-002b", colour: "Black",     size: "34", stock_qty: 3 },
        ]
    },
    {
        productId:   "prod-003",
        productName: "Sneakers",
        image:       "https://via.placeholder.com/150/45B7D1/fff?text=Shoes",
        price:       55000,
        stocks: [
            { stockId: "stk-003a", colour: "White", size: "42", stock_qty: 6 },
            { stockId: "stk-003b", colour: "Black", size: "43", stock_qty: 2 },
        ]
    }
];

/* ═══════════════════════════════════════════════════════════════
   CART MODULE (LocalStorage)
   Cart item shape matches order_items table:
     stockId, productId, productName, image, colour, size,
     maxQty, price, quantity, subtotal
═══════════════════════════════════════════════════════════════ */
const CART_KEY = "shopping_cart";

function getCart()        { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
function saveCart(cart)   { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function clearCart()      { localStorage.removeItem(CART_KEY); }
function getCartTotal()   { return getCart().reduce((sum, i) => sum + i.subtotal, 0); }
function getCartCount()   { return getCart().reduce((sum, i) => sum + i.quantity, 0); }

function addToCart(stockInfo, qty = 1) {
    const cart = getCart();
    const idx  = cart.findIndex(i => i.stockId === stockInfo.stockId);

    if (idx !== -1) {
        const newQty = cart[idx].quantity + qty;
        if (newQty > cart[idx].maxQty) {
            return { success: false, message: `Only ${cart[idx].maxQty} in stock!` };
        }
        cart[idx].quantity = newQty;
        cart[idx].subtotal = parseFloat((cart[idx].price * newQty).toFixed(2));
    } else {
        if (qty > stockInfo.maxQty) {
            return { success: false, message: `Only ${stockInfo.maxQty} in stock!` };
        }
        cart.push({
            stockId:     stockInfo.stockId,
            productId:   stockInfo.productId,
            productName: stockInfo.productName,
            image:       stockInfo.image,
            colour:      stockInfo.colour,
            size:        stockInfo.size,
            maxQty:      stockInfo.maxQty,
            price:       stockInfo.price,
            quantity:    qty,
            subtotal:    parseFloat((stockInfo.price * qty).toFixed(2))
        });
    }
    saveCart(cart);
    updateBadge();
    return { success: true, message: `${stockInfo.productName} added to cart!` };
}

function removeFromCart(stockId) {
    saveCart(getCart().filter(i => i.stockId !== stockId));
    updateBadge();
}

function updateQty(stockId, newQty) {
    if (newQty < 1) { removeFromCart(stockId); return; }
    const cart = getCart();
    const idx  = cart.findIndex(i => i.stockId === stockId);
    if (idx === -1) return;
    if (newQty > cart[idx].maxQty) {
        showToast(`Max stock is ${cart[idx].maxQty}`, "warning"); return;
    }
    cart[idx].quantity = newQty;
    cart[idx].subtotal = parseFloat((cart[idx].price * newQty).toFixed(2));
    saveCart(cart);
    updateBadge();
    renderCart();
}

function updateBadge() {
    const badge = document.getElementById("cart-badge");
    const count = getCartCount();
    badge.textContent = count;
    badge.style.display = count > 0 ? "inline-block" : "none";
}

/* ═══════════════════════════════════════════════════════════════
   CHECKOUT – PLACE ORDER (API CALL)
   POST /api/orders  →  Spring Boot controller
   Payload maps to: orders + order_items tables
═══════════════════════════════════════════════════════════════ */
function buildCheckoutPayload(shippingAddress, phoneNo, paymentMethod) {
    const cart = getCart();
    if (cart.length === 0) throw new Error("Cart is empty.");

    // This payload maps directly to your ERD:
    //   orders.shipping_address, orders.phone_no, orders.payment_method
    //   orders.subtotal_amount  (tax & shipping_fee calculated server-side)
    //   order_items[].stock_id  ← FK to stocks table
    //   order_items[].price, quantity, subtotal
    return {
        shippingAddress,                        // → orders.shipping_address
        phoneNo,                                // → orders.phone_no
        paymentMethod,                          // → orders.payment_method
        subtotalAmount: getCartTotal(),         // → orders.subtotal_amount
        items: cart.map(item => ({
            stockId:  item.stockId,             // → order_items.stock_id (FK to stocks)
            price:    item.price,               // → order_items.price
            quantity: item.quantity,            // → order_items.quantity
            subtotal: item.subtotal             // → order_items.subtotal
        }))
    };
}

async function placeOrder() {
    // ── Step 1: Validate cart ──
    if (getCart().length === 0) {
        setAlert("error", "Your cart is empty."); return;
    }

    // ── Step 2: Collect & validate form ──
    const shippingAddress = document.getElementById("shipping-address").value.trim();
    const phoneNo         = document.getElementById("phone-no").value.trim();
    const paymentMethod   = document.getElementById("payment-method").value;

    if (!shippingAddress) { setAlert("error", "Please enter your shipping address."); return; }
    if (!phoneNo)         { setAlert("error", "Please enter your phone number."); return; }
    if (!paymentMethod)   { setAlert("error", "Please select a payment method."); return; }

    // ── Step 3: Build payload ──
    let payload;
    try { payload = buildCheckoutPayload(shippingAddress, phoneNo, paymentMethod); }
    catch (e) { setAlert("error", e.message); return; }

    // ── Step 4: Show loading spinner ──
    setBtnLoading(true);

    // ── Step 5: Call the API ──
    // ⚠️  DEMO MODE: We simulate a 1.5s API call since there is no real backend here.
    //     In production, replace the block below with the real fetch() call.
    // ────────────────────────────────────────────────────────────────
    // REAL CODE (uncomment when backend is ready):
   
     try {
         const response = await fetch("/api/orders", {
           method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
    
      if (response.ok) {
             const result = await response.json();
           result = { orderId: "uuid", orderNumber: "ORD-20240912-001" }
            clearCart();
             showSuccessPage(result.orderNumber, paymentMethod);
        } else if (response.status === 400) {
             const err = await response.json();
             setAlert("error", err.message || "Stock issue. Please review your cart.");
         } else if (response.status === 401) {
             setAlert("error", "Session expired. Redirecting to login...");
             setTimeout(() => window.location.href = "/login", 2000);
         } else {
             setAlert("error", "Server error. Please try again.");
        }
     } catch (networkErr) {
         setAlert("error", "No connection. Please check your internet.");
     } finally {
         setBtnLoading(false);
     }
    // ────────────────────────────────────────────────────────────────
    //
    // DEMO SIMULATION (remove when backend is ready):
    console.log("📦 Payload sent to POST /api/orders:", JSON.stringify(payload, null, 2));
    await new Promise(resolve => setTimeout(resolve, 1500)); // fake network delay
    const fakeOrderNumber = "ORD-" + Date.now();
    clearCart();
    setBtnLoading(false);
    showSuccessPage(fakeOrderNumber, paymentMethod);
    // ────────────────────────────────────────────────────────────────
}

/* ═══════════════════════════════════════════════════════════════
   PAGE RENDERERS
═══════════════════════════════════════════════════════════════ */
function renderProducts() {
    const grid = document.getElementById("product-grid");
    grid.innerHTML = MOCK_PRODUCTS.map(p => `
        <div class="col-sm-6 col-md-4">
            <div class="card product-card h-100 shadow-sm">
                <img src="${p.image}" class="card-img-top" alt="${p.productName}">
                <div class="card-body">
                    <h6 class="card-title">${p.productName}</h6>
                    <p class="text-primary fw-bold">${p.price.toLocaleString()} MMK</p>
                    <div class="mb-2">
                        <label class="form-label small">Select Variant</label>
                        <select id="variant-${p.productId}" class="form-select form-select-sm">
                            ${p.stocks.map(s =>
                                `<option value="${s.stockId}"
                                         data-colour="${s.colour}"
                                         data-size="${s.size}"
                                         data-maxqty="${s.stock_qty}">
                                    ${s.colour} / ${s.size} (Stock: ${s.stock_qty})
                                </option>`
                            ).join("")}
                        </select>
                    </div>
                    <button class="btn btn-primary btn-sm w-100"
                            onclick="handleAddToCart('${p.productId}', '${p.productName}', '${p.image}', ${p.price})">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>
    `).join("");
}

function handleAddToCart(productId, productName, image, price) {
    const select  = document.getElementById(`variant-${productId}`);
    const opt     = select.options[select.selectedIndex];
    const stockInfo = {
        stockId:     opt.value,
        productId,
        productName,
        image,
        colour:  opt.dataset.colour,
        size:    opt.dataset.size,
        maxQty:  parseInt(opt.dataset.maxqty),
        price
    };
    const result = addToCart(stockInfo, 1);
    showToast(result.message, result.success ? "success" : "danger");
}

function renderCart() {
    const cart      = getCart();
    const container = document.getElementById("cart-container");
    if (cart.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5 text-muted">
                <div class="display-4">🛒</div>
                <p>Your cart is empty.</p>
                <button class="btn btn-outline-primary" onclick="showPage('products')">
                    Browse Products
                </button>
            </div>`;
        return;
    }
    container.innerHTML = `
        <div class="card">
            <div class="table-responsive">
                <table class="table table-borderless align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Product</th>
                            <th>Variant</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Subtotal</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${cart.map(item => `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <img src="${item.image}" width="48" height="48"
                                         style="object-fit:cover;border-radius:6px;">
                                    <span class="fw-semibold">${item.productName}</span>
                                </div>
                            </td>
                            <td><span class="badge bg-secondary">${item.colour} / ${item.size}</span></td>
                            <td>${item.price.toLocaleString()} MMK</td>
                            <td>
                                <div class="d-flex align-items-center gap-1">
                                    <button class="btn btn-sm btn-outline-secondary"
                                            onclick="updateQty('${item.stockId}', ${item.quantity - 1})">−</button>
                                    <span class="px-2">${item.quantity}</span>
                                    <button class="btn btn-sm btn-outline-secondary"
                                            onclick="updateQty('${item.stockId}', ${item.quantity + 1})">+</button>
                                </div>
                            </td>
                            <td class="fw-bold">${item.subtotal.toLocaleString()} MMK</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger"
                                        onclick="removeFromCart('${item.stockId}'); renderCart();">🗑</button>
                            </td>
                        </tr>`).join("")}
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="4" class="text-end fw-bold fs-5">Grand Total:</td>
                            <td colspan="2" class="fw-bold fs-5 text-primary">
                                ${getCartTotal().toLocaleString()} MMK
                            </td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>`;
}

function renderOrderSummary() {
    const cart = getCart();
    document.getElementById("order-summary-items").innerHTML =
        cart.map(i => `
            <div class="d-flex justify-content-between mb-2 small">
                <span>${i.productName} (${i.colour}/${i.size}) ×${i.quantity}</span>
                <span>${i.subtotal.toLocaleString()}</span>
            </div>`).join("") || "<p class='text-muted small'>No items</p>";
    document.getElementById("order-grand-total").textContent =
        `${getCartTotal().toLocaleString()} MMK`;
}

function showSuccessPage(orderNumber, paymentMethod) {
    document.getElementById("success-msg").textContent =
        `Order #${orderNumber} confirmed. Payment: ${paymentMethod}. Thank you! 🙏`;
    showPage("success");
}

/* ═══════════════════════════════════════════════════════════════
   UTILITY HELPERS
═══════════════════════════════════════════════════════════════ */
function showPage(name) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(`page-${name}`).classList.add("active");
    if (name === "cart")     renderCart();
    if (name === "checkout") renderOrderSummary();
    setAlert("clear");
}

function setAlert(type, msg) {
    const el = document.getElementById("checkout-alert");
    if (type === "clear") { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="alert alert-${type === "error" ? "danger" : "success"} mt-2">${msg}</div>`;
}

function setBtnLoading(on) {
    const btn = document.getElementById("place-order-btn");
    btn.disabled  = on;
    btn.innerHTML = on
        ? `<span class="spinner-border spinner-border-sm me-2"></span>Placing Order...`
        : `Place Order`;
}

function showToast(msg, color = "success") {
    const el   = document.getElementById("toast-msg");
    const body = document.getElementById("toast-body");
    el.className = `toast align-items-center text-bg-${color} border-0`;
    body.textContent = msg;
    bootstrap.Toast.getOrCreateInstance(el, { delay: 2500 }).show();
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", () => {
    renderProducts();
    updateBadge();
});
</script>
</body>
</html>
