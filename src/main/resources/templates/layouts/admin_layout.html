
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title layout:title-pattern="$CONTENT_TITLE - BlackJack">
        BlackJack Admin
    </title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- Page-specific CSS can be added by child pages -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body>

    <!-- Admin Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="admin-main">

        <!-- Admin Header -->
        <div th:replace="~{fragments/adminheader :: adminheader}"></div>

        <!-- Page Content -->
        <section class="admin-content" layout:fragment="content">
            <!-- Each admin page content goes here -->
        </section>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Clear cart after successful Admin login -->
    <script th:if="${clearCartOnLogin == true}">
        localStorage.removeItem("shopping_cart");
    </script>

    <!-- Page-specific JavaScript -->
    <th:block layout:fragment="scripts"></th:block>

</body>
</html>
