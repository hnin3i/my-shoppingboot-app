<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - BLACKJACK Admin</title>


<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">


<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">
```

</head>

<body>

	```
	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">


		<!-- Topbar -->
		<div class="admin-topbar">

			<div class="search-box">

				<i class="bi bi-search"></i> <input type="text"
					placeholder="Search category...">

			</div>


			<div class="admin-profile">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>



		<!-- Content -->
		<div class="admin-content">


			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>

					<div class="page-title">Categories</div>

					<div class="page-subtitle">Manage your product categories</div>

				</div>


				<!-- Add Category -->
				<a th:href="@{/categories/add}" class="btn btn-purple"> <i
					class="bi bi-plus-lg"></i> Add Category

				</a>

			</div>



			<!-- Category Card -->
			<div class="admin-card">


				<!-- Card Header -->
				<div class="d-flex justify-content-between align-items-center mb-3">

					<div class="admin-card-title mb-0">Category List</div>


					<div>

						<input type="text" class="form-control"
							placeholder="Search category..." style="width: 220px;">

					</div>

				</div>



				<!-- Table -->
				<div class="table-responsive">

					<table class="admin-table">


						<!-- Table Header -->
						<thead>

							<tr>

								<th>No</th>

								<th>Category Name</th>

								<th>Description</th>

								<th>Status</th>

								<th class="text-end">Action</th>

							</tr>

						</thead>



						<!-- Table Body -->
						<tbody>


							<!-- Dynamic Categories -->
							<tr th:each="category, status : ${categories}">


								<!-- No -->
								<td th:text="${status.count}">1</td>


								<!-- Category Name -->
								<td><strong th:text="${category.name}"> Dresses </strong></td>


								<!-- Description -->
								<td th:text="${category.description}">Description</td>


								<!-- Status -->
								<td>
									<!-- Active --> <span th:if="${category.isActive == 1}"
									class="status status-success"> Active </span> <!-- Inactive -->
									<span th:unless="${category.isActive == 1}"
									class="status status-warning"> Inactive </span>


								</td>



								<!-- Action -->
								<td class="text-end">
									<!-- Detail --> <a
									th:href="@{/categories/detail/{id}(id=${category.id})}"
									class="btn btn-sm btn-outline-info me-1" title="Detail"> <i
										class="bi bi-eye"></i>

								</a> <!-- Edit --> <a
									th:href="@{/categories/edit/{id}(id=${category.id})}"
									class="btn btn-sm btn-outline-secondary me-1" title="Edit">

										<i class="bi bi-pencil"></i>

								</a> <!-- Delete --> <a
									th:href="@{/categories/delete/{id}(id=${category.id})}"
									class="btn btn-sm btn-outline-danger" title="Delete"> <i
										class="bi bi-trash"></i>

								</a>


								</td>


							</tr>



							<!-- Empty Data -->
							<tr th:if="${#lists.isEmpty(categories)}">

								<td colspan="5" class="text-center py-4">No categories
									found.</td>

							</tr>


						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>



	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>
	```

</body>

</html>
