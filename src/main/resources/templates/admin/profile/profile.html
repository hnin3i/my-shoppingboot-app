<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile - BLACKJACK</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
	rel="stylesheet">

<style>
body {
	background: #f7f7fb;
	color: #222;
	font-family: Arial, Helvetica, sans-serif;
}

.profile-container {
	max-width: 900px;
	margin: 50px auto;
	padding: 0 20px;
}

.profile-card {
	background: #fff;
	border: 1px solid #e5e5e5;
	border-radius: 12px;
	overflow: hidden;
}

/* Profile Header */
.profile-header {
	background: #050505;
	color: #fff;
	padding: 35px;
}

.profile-photo-wrapper {
	position: relative;
	width: 100px;
	height: 100px;
}

.profile-photo {
	width: 100px;
	height: 100px;
	border-radius: 50%;
	object-fit: cover;
	border: 3px solid #fff;
}

.active-dot {
	position: absolute;
	right: 2px;
	bottom: 4px;
	width: 18px;
	height: 18px;
	background: #22c55e;
	border: 3px solid #fff;
	border-radius: 50%;
}

.profile-name {
	margin-top: 15px;
	margin-bottom: 5px;
	font-size: 24px;
	font-weight: 600;
}

.profile-status {
	color: #22c55e;
	font-size: 14px;
}

/* Profile Body */
.profile-body {
	padding: 35px;
}

.section-title {
	font-size: 19px;
	font-weight: 600;
	margin-bottom: 25px;
}

.form-label {
	font-size: 14px;
	font-weight: 600;
}

.form-control {
	border-radius: 6px;
	padding: 10px 12px;
}

/* Change Photo Button */
.change-photo-btn {
	display: inline-block;
	margin-top: 15px;
	padding: 8px 18px;
	background: #fff;
	color: #111;
	border: 1px solid #ddd;
	border-radius: 6px;
	cursor: pointer;
	font-size: 14px;
}

.change-photo-btn:hover {
	background: #f1f1f1;
}

/* Save Button */
.save-btn {
	background: #050505;
	color: #fff;
	border: none;
	padding: 10px 25px;
	border-radius: 6px;
}

.save-btn:hover {
	background: #333;
	color: #fff;
}

/* Cancel Button */
.cancel-btn {
	background: #fff;
	color: #222;
	border: 1px solid #ddd;
	padding: 10px 25px;
	border-radius: 6px;
}

.cancel-btn:hover {
	background: #f1f1f1;
}
</style>

</head>


<body>

	<div class="profile-container">

		<div class="profile-card">


			<!-- ========================= -->
			<!-- PROFILE HEADER -->
			<!-- ========================= -->

			<div class="profile-header">

				<div class="profile-photo-wrapper">

					<img id="profilePreview" src="/images/admin/admin.jpg" alt="Admin Profile"
						class="profile-photo">

					<!-- Active Status -->
					<span class="active-dot"></span>

				</div>

				<h1 class="profile-name">Admin</h1>

				<div class="profile-status">
					<i class="bi bi-circle-fill me-1"></i> Active
				</div>

			</div>


			<!-- ========================= -->
			<!-- PROFILE FORM -->
			<!-- ========================= -->

			<div class="profile-body">

				<h2 class="section-title">Profile Information</h2>


				<form th:action="@{/admin/profile/update}" method="post"
					enctype="multipart/form-data">


					<!-- Profile Photo -->

					<div class="mb-4">

						<label class="form-label d-block"> Profile Photo </label> <label
							for="profilePhoto" class="change-photo-btn"> <i
							class="bi bi-camera me-1"></i> Change Photo

						</label> <input type="file" id="profilePhoto" name="profilePhoto"
							accept="image/*" hidden>

					</div>


					<!-- Full Name -->

					<div class="row">

						<div class="col-md-6 mb-3">

							<label for="name" class="form-label"> Full Name </label> <input
								type="text" id="name" name="name" class="form-control"
								value="Admin">

						</div>


						<!-- Email -->

						<div class="col-md-6 mb-3">

							<label for="email" class="form-label"> Email </label> <input
								type="email" id="email" name="email" class="form-control"
								value="admin@blackjack.com">

						</div>


						<!-- Phone -->

						<div class="col-md-6 mb-3">

							<label for="phone" class="form-label"> Phone </label> <input
								type="text" id="phone" name="phone" class="form-control"
								value="+95 9 123 456 789">

						</div>


						<!-- Status -->

						<div class="col-md-6 mb-3">

							<label class="form-label"> Account Status </label> <input
								type="text" class="form-control" value="Active" readonly>

						</div>

					</div>


					<!-- Buttons -->

					<div class="d-flex gap-2 mt-4">

						<button type="submit" class="save-btn">

							<i class="bi bi-check-lg me-1"></i> Save Changes

						</button>

						<a th:href="@{/admin/dashboard}" class="btn btn-secondary">
							 Cancel

						</a>

					</div>

				</form>

			</div>

		</div>

	</div>


	<!-- ========================= -->
	<!-- PHOTO PREVIEW -->
	<!-- ========================= -->

	<script>

    const profilePhoto = document.getElementById("profilePhoto");
    const profilePreview = document.getElementById("profilePreview");

    profilePhoto.addEventListener("change", function () {

        const file = this.files[0];

        if (file) {

            profilePreview.src = URL.createObjectURL(file);

        }

    });

</script>


</body>
</html>
