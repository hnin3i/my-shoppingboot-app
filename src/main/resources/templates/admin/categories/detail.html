<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - BLACKJACK Admin</title>


<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">


<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">


</head>

<body>

	```
	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">


		<!-- Topbar -->
		<div class="admin-topbar">

			<!-- Admin Profile -->
			<div class="admin-profile" style="margin-left: auto;">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>



		<!-- Content -->
		<div class="admin-content">


			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>

					<div class="page-title">Category Detail</div>

				</div>

			</div>



			<!-- Category Card -->
			<div class="admin-card">


				<!-- Card Header -->
				<div class="d-flex justify-content-between align-items-center mb-3">


				</div>

				<div>

					<p>
						Name : <span th:text="${category.name}"></span>
					</p>

					<p>
						Description : <span th:text="${category.description}"></span>
					</p>

					<p>
						Status : <span
							th:text="${category.isActive == 1 ? 'Active' : 'Inactive'}">
						</span>
					</p>

					<br> <a th:href="@{/admin/categories}"><button
							type="button" class="btn btn-secondary">BACK</button> </a>


				</div>

			</div>

		</div>

	</div>



	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>
	```

</body>

</html>
