<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - BLACKJACK Admin</title>



<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">


<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>


<body>


	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">


		<!-- Topbar -->
		<div class="admin-topbar">

			<div class="admin-profile" style="margin-left: auto;">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>


		<!-- Content -->
		<div class="admin-content">


			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>

					<div class="page-title">Categories</div>

					<div class="page-subtitle">Manage your product categories</div>

				</div>


				<!-- Add Category -->
				<a th:href="@{/admin/categories/add}" class="btn btn-purple"> <i
					class="bi bi-plus-lg"></i> Add Category

				</a>

			</div>


			<!-- Category Card -->
			<div class="admin-card">


				<!-- Card Header -->
				<div class="d-flex justify-content-between align-items-center mb-3">


					<!-- Title -->
					<div class="admin-card-title mb-0">Category List</div>


					<!-- Search + Status -->
					<div class="d-flex gap-2">


						<!-- Search -->
						<input type="text" id="categorySearch" class="form-control"
							placeholder="Search category..." style="width: 220px;">


						<!-- Status Filter -->
						<select id="statusFilter" class="form-select"
							style="width: 140px;">

							<!-- Active is default -->
							<option value="1" selected>Active</option>

							<option value="all">All Status</option>

							<option value="0">Inactive</option>

						</select>

					</div>

				</div>


				<!-- Table -->
				<div class="table-responsive">

					<table class="admin-table">


						<!-- Table Header -->
						<thead>

							<tr>

								<th>No</th>

								<th>Category Name</th>

								<th>Description</th>

								<th>Status</th>

								<th class="text-end">Action</th>

							</tr>

						</thead>


						<!-- Table Body -->
						<tbody>


							<!-- Categories -->
							<tr th:each="category, status : ${categories}"
								class="category-row" th:data-status="${category.isActive}">


								<!-- No -->
								<td th:text="${status.count}">1</td>


								<!-- Category Name -->
								<td><strong th:text="${category.name}"> Dresses </strong></td>


								<!-- Description -->
								<td th:text="${category.description}">Description</td>


								<!-- Status -->
								<td>
									<!-- Active --> <span th:if="${category.isActive == 1}"
									class="status status-success"> Active </span> <!-- Inactive -->
									<span th:unless="${category.isActive == 1}"
									class="status status-warning"> Inactive </span>

								</td>


								<!-- Action -->
								<td class="text-end">
									<!-- Detail --> <a
									th:href="@{/admin/categories/detail/{id}(id=${category.id})}"
									class="btn btn-sm btn-outline-info me-1" title="Detail"> <i
										class="bi bi-eye"></i>

								</a> <!-- Edit --> <a
									th:href="@{/admin/categories/edit/{id}(id=${category.id})}"
									class="btn btn-sm btn-outline-secondary me-1" title="Edit">

										<i class="bi bi-pencil"></i>

								</a> <!-- Delete --> <a
									th:href="@{/admin/categories/delete/{id}(id=${category.id})}"
									class="btn btn-sm btn-outline-danger" title="Delete"> <i
										class="bi bi-trash"></i>

								</a>

								</td>

							</tr>


							<!-- No Search Result -->
							<tr id="noSearchResult" style="display: none;">

								<td colspan="5" class="text-center py-4">No categories
									found.</td>

							</tr>


							<!-- Empty Database -->
							<tr th:if="${#lists.isEmpty(categories)}">

								<td colspan="5" class="text-center py-4">No categories
									found.</td>

							</tr>


						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>


	<!-- Category Search + Status Filter -->
	<script>
		const searchInput = document.getElementById("categorySearch");

		const statusFilter = document.getElementById("statusFilter");

		const categoryRows = document.querySelectorAll(".category-row");

		const noSearchResult = document.getElementById("noSearchResult");

		function filterCategories() {

			const searchText = searchInput.value.toLowerCase().trim();

			const selectedStatus = statusFilter.value;

			let found = false;

			categoryRows
					.forEach(function(row) {

						/* Category Name */
						const categoryName = row
								.querySelector("td:nth-child(2)").innerText
								.toLowerCase();

						/* Description */
						const description = row
								.querySelector("td:nth-child(3)").innerText
								.toLowerCase();

						/* Status */
						const categoryStatus = row.getAttribute("data-status");

						/* Search */
						const matchesSearch = categoryName.includes(searchText)
								|| description.includes(searchText);

						/* Status Filter */
						const matchesStatus = selectedStatus === "all"
								|| categoryStatus === selectedStatus;

						/* Show / Hide */
						if (matchesSearch && matchesStatus) {

							row.style.display = "";

							found = true;

						} else {

							row.style.display = "none";

						}

					});

			/* No Result */
			if (found) {

				noSearchResult.style.display = "none";

			} else {

				noSearchResult.style.display = "";

			}

		}

		/* Search */
		searchInput.addEventListener("input", filterCategories);

		/* Status Filter */
		statusFilter.addEventListener("change", filterCategories);

		/* Default = Active */
		filterCategories();
	</script>


</body>

</html>
