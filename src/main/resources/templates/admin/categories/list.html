<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Categories - BLACKJACK Admin</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">

		<!-- Topbar -->
		<div class="admin-topbar">

			<div class="search-box">
				<i class="bi bi-search"></i> <input type="text"
					placeholder="Search category...">
			</div>

			<div class="admin-profile">
				<div class="admin-avatar">A</div>
				<div>
					<strong>Admin</strong>
				</div>
			</div>

		</div>


		<!-- Content -->
		<div class="admin-content">

			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>
					<div class="page-title">Categories</div>
					<div class="page-subtitle">Manage your product categories</div>
				</div>

				<button class="btn btn-purple" data-bs-toggle="modal"
					data-bs-target="#addCategoryModal">

					<i class="bi bi-plus-lg"></i> Add Category

				</button>

			</div>


			<!-- Category Card -->
			<div class="admin-card">

				<div class="d-flex justify-content-between align-items-center mb-3">

					<div class="admin-card-title mb-0">Category List</div>

					<div>
						<input type="text" class="form-control"
							placeholder="Search category..." style="width: 220px;">
					</div>

				</div>


				<!-- Table -->
				<div class="table-responsive">

					<table class="admin-table">

						<thead>
							<tr>
								<th>ID</th>
								<th>Category Name</th>
								<th>Status</th>
								<th class="text-end">Action</th>
							</tr>
						</thead>

						<tbody>

							<!-- UI Dummy Data -->
							<tr>
								<td>1</td>

								<td><strong>Dresses</strong></td>

								<td><span class="status status-success"> Active </span></td>

								<td class="text-end">

									<button class="btn btn-sm btn-outline-secondary me-1">
										<i class="bi bi-pencil"></i>
									</button>

									<button class="btn btn-sm btn-outline-danger">
										<i class="bi bi-trash"></i>
									</button>

								</td>
							</tr>


							<tr>
								<td>2</td>

								<td><strong>Tops</strong></td>

								<td><span class="status status-success"> Active </span></td>

								<td class="text-end">

									<button class="btn btn-sm btn-outline-secondary me-1">
										<i class="bi bi-pencil"></i>
									</button>

									<button class="btn btn-sm btn-outline-danger">
										<i class="bi bi-trash"></i>
									</button>

								</td>
							</tr>


							<tr>
								<td>3</td>

								<td><strong>Bottoms</strong></td>

								<td><span class="status status-success"> Active </span></td>

								<td class="text-end">

									<button class="btn btn-sm btn-outline-secondary me-1">
										<i class="bi bi-pencil"></i>
									</button>

									<button class="btn btn-sm btn-outline-danger">
										<i class="bi bi-trash"></i>
									</button>

								</td>
							</tr>


							<tr>
								<td>4</td>

								<td><strong>Accessories</strong></td>

								<td><span class="status status-warning"> Inactive </span></td>

								<td class="text-end">

									<button class="btn btn-sm btn-outline-secondary me-1">
										<i class="bi bi-pencil"></i>
									</button>

									<button class="btn btn-sm btn-outline-danger">
										<i class="bi bi-trash"></i>
									</button>

								</td>
							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>


	<!-- Add Category Modal -->
	<div class="modal fade" id="addCategoryModal" tabindex="-1"
		aria-hidden="true">

		<div class="modal-dialog modal-dialog-centered">

			<div class="modal-content">

				<div class="modal-header">

					<h5 class="modal-title">Add Category</h5>

					<button type="button" class="btn-close" data-bs-dismiss="modal">
					</button>

				</div>


				<div class="modal-body">

					<div class="mb-3">

						<label class="form-label"> Category Name </label> <input
							type="text" class="form-control"
							placeholder="Enter category name">

					</div>


					<div class="mb-3">

						<label class="form-label"> Status </label> <select
							class="form-select">

							<option selected>Active</option>
							<option>Inactive</option>

						</select>

					</div>

				</div>


				<div class="modal-footer">

					<button type="button" class="btn btn-light" data-bs-dismiss="modal">

						Cancel</button>

					<button type="button" class="btn btn-purple">Save Category

					</button>

				</div>

			</div>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
