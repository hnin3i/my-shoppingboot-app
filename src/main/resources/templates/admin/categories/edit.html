<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Category - BLACKJACK Admin</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">


		<!-- Topbar -->
		<!-- Topbar -->
		<div class="admin-topbar">

			<!-- Admin Profile -->
			<div class="admin-profile" style="margin-left: auto;">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>

		<!-- Content -->
		<div class="admin-content">


			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>

					<div class="page-title">Edit Category</div>

					<div class="page-subtitle">Update category information</div>

				</div>

			</div>


			<!-- Category Card -->
			<div class="admin-card">

				<form th:action="@{/categories/edit}" th:object="${category}"
					method="post">


					<!-- Error Message -->
					<div th:if="${error}" style="color: red; margin-bottom: 15px;">

						<strong>Error:</strong> <span th:text="${error}"></span>

					</div>


					<!-- ID -->
					<input type="hidden" th:field="*{id}">


					<!-- Name -->
					<div class="mb-3 row">

						<label for="InputYourName" class="col-sm-2 col-form-label">

							Name : </label>

						<div class="col-sm-5">

							<input type="text" class="form-control" id="InputYourName"
								th:field="*{name}">

						</div>

					</div>


					<!-- Description -->
					<div class="mb-3 row">

						<label for="InputDescription" class="col-sm-2 col-form-label">

							Description : </label>

						<div class="col-sm-5">

							<textarea class="form-control" id="InputDescription"
								th:field="*{description}" rows="5">
                            </textarea>

						</div>

					</div>


					<!-- Status -->
					<div class="mb-3 row">

						<label for="status" class="col-sm-2 col-form-label">

							Status : </label>

						<div class="col-sm-5">

							<select class="form-select" id="status" th:field="*{isActive}">

								<option value="1">Active</option>

								<option value="0">Inactive</option>

							</select>

						</div>

					</div>


					<!-- Buttons -->
					<div class="mt-4">

						<button type="submit" class="btn btn-primary me-2">

							<i class="bi bi-check-lg"></i> Update

						</button>


						<a th:href="@{/categories}" class="btn btn-secondary"> <i
							class="bi bi-x-lg"></i> Cancel

						</a>

					</div>

				</form>

			</div>

		</div>

	</div>


	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
