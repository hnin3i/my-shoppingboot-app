<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Category - BLACKJACK Admin</title>

<!-- Bootstrap -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Admin CSS -->
<link rel="stylesheet" th:href="@{/css/admin.css}">

<!-- SweetAlert2 CDN-->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

	<!-- Sidebar -->
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main -->
	<div class="admin-main">
		<div th:replace="~{fragments/adminheader :: adminheader}"></div>


		<!-- Content -->
		<div class="admin-content">


			<div class="mb-4">

				<h1 class="page-title">Delete Category</h1>

				<p class="page-subtitle">Remove category from your store</p>

			</div>

			<div class="admin-card">


				<div class="text-center" style="padding: 50px 20px;">

					<div class="mb-4">

						<i class="bi bi-exclamation-triangle-fill text-danger"
							style="font-size: 60px;"> </i>

					</div>



					<h3>Are you sure?</h3>



					<p class="text-muted mt-3">You are about to delete:</p>



					<h4 th:text="${category.name}" class="mb-3">Category Name</h4>



					<p class="text-muted">This action cannot be undone.</p>

					<form
						th:action="@{/admin/categories/delete/{id}(id=${category.id})}"
						method="post" class="mt-4">


						<button type="submit" class="btn btn-danger me-2">

							<i class="bi bi-trash"></i> Yes, Delete

						</button>


						<a th:href="@{/admin/categories}" class="btn btn-secondary"> <i
							class="bi bi-x-lg"></i> Cancel

						</a>


					</form>


				</div>

			</div>

		</div>

	</div>



	



	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>
	
	<script th:inline="javascript">
    /*<![CDATA[*/
    var errorMessage = /*[[${errorMessage}]]*/ null;
    
    if (errorMessage) {
        Swal.fire({
            text: errorMessage,
            confirmButtonText: 'OK',
            confirmButtonColor: '#d33'
        });
    }
    /*]]>*/
</script>

</body>

</html>
