<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - BLACKJACK Admin</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Your existing admin.css -->
<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main Container -->
	<main class="admin-main">

		<!-- Topbar -->
		<div class="admin-topbar">
			<div class="admin-profile" style="margin-left: auto;">
				<div class="admin-avatar">A</div>
				<div>
					<strong>Admin</strong>
				</div>
			</div>
		</div>

		<div class="admin-content">

			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-start mb-4">

				<div>

					<h1 class="page-title">Users</h1>

					<p class="page-subtitle">Manage registered users and their
						roles</p>

				</div>

			</div>


			<!-- User Card -->
			<div class="admin-card">

				<!-- Search & Count Header -->
				<div class="d-flex justify-content-between align-items-center mb-3">

					<div>

						<h5 class="admin-card-title">User List</h5>

						<p class="text-secondary small mb-0"
							th:text="${totalUsers != null
                                     ? totalUsers
                                     : (users != null ? users.size() : 0)} + ' users'">

							0 users</p>

					</div>


					<!-- Search Form -->
					<form th:action="@{/admin/users}" method="get" class="search-box">

						<i class="bi bi-search"></i> <input type="text" name="keyword"
							th:value="${keyword}" placeholder="Search user..."
							onchange="this.form.submit()">

					</form>

				</div>


				<!-- Dynamic Users Table -->
				<div class="table-responsive">

					<table class="admin-table">

						<thead>

							<tr>
								<th>Name</th>
								<th>Email</th>
								<th>Phone</th>
								<th>Role</th>
								<th>Joined</th>

							</tr>

						</thead>


						<tbody>

							<!-- Loop over dynamic users -->
							<tr th:each="user : ${users}">

								<!-- Name + First Initial Avatar -->
								<td>

									<div class="d-flex align-items-center">

										<div class="admin-avatar me-2"
											th:text="${user.name != null
                                                       and !user.name.isEmpty()
                                                       ? #strings.substring(
                                                           user.name,
                                                           0,
                                                           1
                                                         ).toUpperCase()
                                                       : 'U'}">

											U</div>

										<span class="fw-semibold" th:text="${user.name}"> User
											Name </span>

									</div>

								</td>


								<!-- Email -->
								<td th:text="${user.email}">user@example.com</td>


								<!-- Phone -->
								<td
									th:text="${user.phone != null
                                              and !user.phone.isEmpty()
                                              ? user.phone
                                              : '-'}">

									-</td>


								<!-- Role -->
								<td><span class="d-inline-flex align-items-center gap-1">

										<!-- Admin Icon --> <i
										th:if="${#strings.toUpperCase(
                                                    #strings.toString(user.role)
                                                  ).contains('ADMIN')}"
										class="bi bi-shield-check text-primary"> </i> <!-- Customer Icon -->
										<i
										th:unless="${#strings.toUpperCase(
                                                        #strings.toString(user.role)
                                                      ).contains('ADMIN')}"
										class="bi bi-person"> </i> <!-- Role Name --> <span
										th:text="${#strings.toUpperCase(
                                                        #strings.toString(user.role)
                                                      ).contains('ADMIN')
                                                      ? 'Admin'
                                                      : 'Customer'}">

											Customer </span>

								</span></td>


								<!-- Joined Date -->
								<td
									th:text="${user.created_at != null
                                              ? #temporals.format(
                                                    user.created_at,
                                                    'yyyy-MM-dd'
                                                )
                                              : '-'}">

									-</td>

							</tr>


							<!-- Empty State -->
							<tr th:if="${#lists.isEmpty(users)}">

								<td colspan="6" class="text-center py-5 text-secondary"><i
									class="bi bi-people fs-2 d-block mb-2"></i> No users found.</td>

							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</main>


	<!-- Bootstrap 5 JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
