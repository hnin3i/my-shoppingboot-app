<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Users - BLACKJACK Admin</title>

<!-- Bootstrap 5 CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Your existing admin.css -->
<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<!-- Main Container -->
	<main class="admin-main">

		<!-- Topbar -->
		<div class="admin-topbar">
			<div class="admin-profile" style="margin-left: auto;">
				<div class="admin-avatar">A</div>
				<div>
					<strong>Admin</strong>
				</div>

				<!-- Filter / Search Form -->
				<form th:action="@{/admin/users}" method="get" class="search-box">
					<i class="bi bi-search"></i> <input type="text" name="keyword"
						th:value="${keyword}" class="form-control"
						placeholder="Search user..." onchange="this.form.submit()">
				</form>
			</div>

			<!-- Dynamic Users Table -->
			<div class="table-responsive">
				<table class="table-custom">
					<thead>
						<tr>
							<th>Name</th>
							<th>Email</th>
							<th>Phone</th>
							<th>Role</th>
							<th>Joined</th>
							<th class="text-end pe-3">Action</th>
						</tr>
					</thead>
					<tbody>
						<!-- Loop over dynamic users -->
						<tr th:each="user : ${users}">
							<!-- Name + First Initial Avatar -->
							<td>
								<div class="d-flex align-items-center">
									<div class="user-avatar-badge"
										th:text="${user.name != null and !user.name.isEmpty() ? #strings.substring(user.name, 0, 1).toUpperCase() : 'U'}">
										J</div>
									<div class="user-name-title" th:text="${user.name}">Jessica
										Smith</div>
								</div>
							</td>

							<!-- Email -->
							<td th:text="${user.email}">user@example.com</td>

							<!-- Phone -->
							<td
								th:text="${user.phone != null and !user.phone.isEmpty() ? user.phone : '-'}">09
								123 456 789</td>

							<!-- Role: Dynamic Shield vs Person icon -->
							<td><span class="role-badge"> <i
									th:if="${#strings.toUpperCase(#strings.toString(user.role)).contains('ADMIN')}"
									class="bi bi-shield-check text-primary"></i> <i
									th:unless="${#strings.toUpperCase(#strings.toString(user.role)).contains('ADMIN')}"
									class="bi bi-person"></i> <span
									th:text="${#strings.toUpperCase(#strings.toString(user.role)).contains('ADMIN') ? 'Admin' : 'Customer'}">
										Customer </span>
							</span></td>

							<!-- Joined Date -->
							<td
								th:text="${user.created_at != null ? #temporals.format(user.created_at, 'yyyy-MM-dd') : '2026-09-01'}">
								2026-09-01</td>

							<!-- Actions (Edit & Delete) -->
							<td class="text-end pe-2">
								<div class="d-inline-flex gap-2">
									<!-- Edit Link -->
									<a th:href="@{/admin/users/edit(id=${user.id})}"
										class="btn-action-edit" title="Edit User"> <i
										class="bi bi-pencil"></i>
									</a>

									<!-- Delete Form with Confirmation Dialog -->
									<form th:action="@{/admin/users/delete}" method="post"
										onsubmit="return confirm('Are you sure you want to delete this user?');"
										style="display: inline;">
										<input type="hidden" name="id" th:value="${user.id}" />
										<button type="submit" class="btn-action-delete"
											title="Delete User">
											<i class="bi bi-trash"></i>
										</button>
									</form>
								</div>
							</td>
						</tr>

						<!-- Empty State if no users found -->
						<tr th:if="${#lists.isEmpty(users)}">
							<td colspan="6" class="text-center py-5 text-secondary"><i
								class="bi bi-people fs-2 d-block mb-2 text-muted"></i> No users
								found.</td>
						</tr>
					</tbody>
				</table>

			</div>
		</div>

		<div class="admin-content">

			<!-- Page Header -->
			<div class="d-flex justify-content-between align-items-start mb-4">

				<div>

					<h1 class="page-title">Users</h1>

					<p class="page-subtitle">Manage registered users and their
						roles</p>

				</div>

				<!-- Add User Button -->
				<a th:href="@{/admin/users/add}"
					class="btn-purple text-decoration-none d-inline-flex align-items-center gap-2">

					<i class="bi bi-plus-lg"></i> Add User

				</a>

			</div>


			<!-- User Card -->
			<div class="admin-card">

				<!-- Search & Count Header -->
				<div class="d-flex justify-content-between align-items-center mb-3">

					<div>

						<h5 class="admin-card-title">User List</h5>

						<p class="text-secondary small mb-0"
							th:text="${totalUsers != null
                                     ? totalUsers
                                     : (users != null ? users.size() : 0)} + ' users'">

							0 users</p>

					</div>


					<!-- Search Form -->
					<form th:action="@{/admin/users}" method="get" class="search-box">

						<i class="bi bi-search"></i> <input type="text" name="keyword"
							th:value="${keyword}" placeholder="Search user..."
							onchange="this.form.submit()">

					</form>

				</div>


				<!-- Dynamic Users Table -->
				<div class="table-responsive">

					<table class="admin-table">

						<thead>

							<tr>
								<th>Name</th>
								<th>Email</th>
								<th>Phone</th>
								<th>Role</th>
								<th>Joined</th>

							</tr>

						</thead>


						<tbody>

							<!-- Loop over dynamic users -->
							<tr th:each="user : ${users}">

								<!-- Name + First Initial Avatar -->
								<td>

									<div class="d-flex align-items-center">

										<div class="admin-avatar me-2"
											th:text="${user.name != null
                                                       and !user.name.isEmpty()
                                                       ? #strings.substring(
                                                           user.name,
                                                           0,
                                                           1
                                                         ).toUpperCase()
                                                       : 'U'}">

											U</div>

										<span class="fw-semibold" th:text="${user.name}"> User
											Name </span>

									</div>

								</td>


								<!-- Email -->
								<td th:text="${user.email}">user@example.com</td>


								<!-- Phone -->
								<td
									th:text="${user.phone != null
                                              and !user.phone.isEmpty()
                                              ? user.phone
                                              : '-'}">

									-</td>


								<!-- Role -->
								<td><span class="d-inline-flex align-items-center gap-1">

										<!-- Admin Icon --> <i
										th:if="${#strings.toUpperCase(
                                                    #strings.toString(user.role)
                                                  ).contains('ADMIN')}"
										class="bi bi-shield-check text-primary"> </i> <!-- Customer Icon -->
										<i
										th:unless="${#strings.toUpperCase(
                                                        #strings.toString(user.role)
                                                      ).contains('ADMIN')}"
										class="bi bi-person"> </i> <!-- Role Name --> <span
										th:text="${#strings.toUpperCase(
                                                        #strings.toString(user.role)
                                                      ).contains('ADMIN')
                                                      ? 'Admin'
                                                      : 'Customer'}">

											Customer </span>

								</span></td>


								<!-- Joined Date -->
								<td
									th:text="${user.created_at != null
                                              ? #temporals.format(
                                                    user.created_at,
                                                    'yyyy-MM-dd'
                                                )
                                              : '-'}">

									-</td>




							</tr>


							<!-- Empty State -->
							<tr th:if="${#lists.isEmpty(users)}">

								<td colspan="6" class="text-center py-5 text-secondary"><i
									class="bi bi-people fs-2 d-block mb-2"></i> No users found.</td>

							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</main>


	<!-- Bootstrap 5 JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
