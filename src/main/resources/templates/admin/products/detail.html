<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Detail - BLACKJACK Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<main class="admin-main">

		<div class="admin-topbar">

			<div class="admin-profile" style="margin-left: auto;">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>

		<div class="admin-content">


			<div class="d-flex justify-content-between align-items-center mb-4">

				<div>

					<h1 class="page-title">Product Detail</h1>

					<p class="page-subtitle">View product information</p>

				</div>


				<div>

					<a th:href="@{/admin/products}" class="btn btn-secondary"> <i
						class="bi bi-arrow-left"></i> Back

					</a> <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
						class="btn btn-purple"> <i class="bi bi-pencil"></i> Edit
						Product

					</a>

				</div>

			</div>

			<div class="admin-card">

				<div class="row g-4">


					<!-- IMAGE -->

					<div class="col-md-4 text-center">


						<div th:if="${product.image != null and product.image != ''}">

							<img th:src="@{'/images/product/' + ${product.image}}"
								class="img-fluid rounded"
								style="max-height: 350px; object-fit: cover;">

						</div>


						<div th:unless="${product.image != null and product.image != ''}"
							style="height: 300px; background: #f5f5f5; border-radius: 10px; display: flex; align-items: center; justify-content: center;">

							<div>

								<i class="bi bi-image text-muted" style="font-size: 50px;">
								</i>

								<p class="text-muted">No Image</p>

							</div>

						</div>


					</div>

					<div class="col-md-8">


						<h2 th:text="${product.name}" class="mb-4">Product Name</h2>



						<div class="row mb-3">

							<div class="col-md-4">
								<strong>Category</strong>
							</div>

							<div class="col-md-8" th:text="${product.categoryName}">-</div>

						</div>



						<div class="row mb-3">

							<div class="col-md-4">
								<strong>Price</strong>
							</div>

							<div class="col-md-8 product-price"
								th:text="${'' + #numbers.formatDecimal(product.price, 1, 'COMMA', 0, 'POINT')}">



								0</div>

						</div>



						<div class="row mb-3">

							<div class="col-md-4">
								<strong>Description</strong>
							</div>

							<div class="col-md-8" th:text="${product.description}">-</div>

						</div>



						<div class="row mb-3">

							<div class="col-md-4">
								<strong>Discount</strong>
							</div>

							<div class="col-md-8">



								<span th:if="${product.isDiscount == 1}"
									class="status status-warning"> <span
									th:text="${#numbers.formatDecimal(product.discountPrice, 1, 'COMMA', 0, 'POINT')}">
										10,000 </span> &nbsp;OFF

								</span> <span th:unless="${product.isDiscount == 1}" class="col-md-4">

									No Discount </span>



							</div>

						</div>



						<div class="row mb-3">

							<div class="col-md-4">
								<strong>Sale Price</strong>
							</div>

							<div class="col-md-8 product.finalPrice"
								th:text="${'' + #numbers.formatDecimal(product.finalPrice, 1, 'COMMA', 0, 'POINT')}">

								0</div>

						</div>


						<div class="row mb-3">
							<div class="col-md-4">
								<strong>Discount Duration</strong>
							</div>

							<div class="col-md-8">
								<span th:if="${product.discountDuration != null}"
									th:text="${#temporals.format(product.discountDuration, 'dd/MM/yyyy')}">
								</span> <span th:if="${product.discountDuration == null}"> - </span>
							</div>
						</div>




						<div class="row mb-3">

							<div class="col-md-4">
								<strong>Status</strong>
							</div>

							<div class="col-md-8">


								<span th:if="${product.isActive == 1}"
									class="status status-success"> Active </span> <span
									th:unless="${product.isActive == 1}"
									class="status status-danger"> Inactive </span>


							</div>

						</div>


					</div>

				</div>

			</div>

		</div>

	</main>



	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>

</html>
