<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product - BLACKJACK Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>


	<div th:replace="~{fragments/sidebar :: sidebar}"></div>


	<main class="admin-main">

		<div class="admin-topbar">

			<div class="admin-profile" style="margin-left: auto;">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>

		<div class="admin-content">

			<div class="mb-4">

				<h1 class="page-title">Add Product</h1>

				<p class="page-subtitle">Add a new fashion product</p>

			</div>

			<div class="admin-card">


				<form th:action="@{/admin/products/add}" th:object="${product}"
					method="post" enctype="multipart/form-data">


					<div class="row g-3">


						<!-- Product Name -->

						<div class="col-md-8">

							<label class="form-label"> Product Name </label> <input
								type="text" th:field="*{name}" class="form-control"
								placeholder="Enter product name" required>

						</div>


						<div class="col-md-4">

							<label class="form-label"> Category </label> <select
								th:field="*{categoryId}" class="form-select" required>

								<option value="">Select Category</option>

								<option th:each="category : ${categories}"
									th:value="${category.id}" th:text="${category.name}">
									Category</option>

							</select>

						</div>

						<div class="col-md-6">

							<label class="form-label"> Price </label> <input type="number"
								step="0.01" min="0" th:field="*{price}" class="form-control"
								placeholder="0.00" required>

						</div>


						<div class="col-md-6">

							<label class="form-label"> Product Image </label> <input
								type="file" name="imageFile" class="form-control"
								accept="image/*">

						</div>


						<div class="col-12">

							<label class="form-label"> Description </label>

							<textarea th:field="*{description}" class="form-control" rows="4"
								placeholder="Enter product description">
                        </textarea>

						</div>


						<div class="col-md-6">

							<label class="form-label"> Discount </label> <select
								th:field="*{isDiscount}" class="form-select">

								<option value="0">No Discount</option>

								<option value="1">Discount</option>

							</select>

						</div>

						<div class="col-md-6">

							<label class="form-label"> Discount Amount </label> <input
								type="number" min="0" th:field="*{discountPrice}"
								class="form-control" placeholder="0">

						</div>

						<div class="col-md-6">

							<label class="form-label"> Discount Duration </label> <input
								type="date" id="discountDuration" name="discountDuration"
								th:value="${product.discountDuration != null ? #temporals.format(product.discountDuration, 'yyyy-MM-dd') : ''}"
								class="form-control">

						</div>



						<!-- Status -->

						<div class="col-md-6">

							<label class="form-label"> Status </label> <select
								th:field="*{isActive}" class="form-select">

								<option value="1">Active</option>

								<option value="0">Inactive</option>

							</select>

						</div>


					</div>


					<div class="mt-4">


						<button type="submit" class="btn btn-purple">

							<i class="bi bi-check-lg"></i> Save Product

						</button>


						<a th:href="@{/admin/products}" class="btn btn-secondary"> <i
							class="bi bi-arrow-left"></i> Cancel

						</a>


					</div>


				</form>

			</div>

		</div>

	</main>



	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>


</body>

</html>
