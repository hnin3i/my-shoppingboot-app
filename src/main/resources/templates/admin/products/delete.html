<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Product - BLACKJACK Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>

<body>


	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<main class="admin-main">

		<div class="admin-topbar">

			<!-- Admin Profile -->
			<div class="admin-profile" style="margin-left: auto;">

				<div class="admin-avatar">A</div>

				<div>
					<strong>Admin</strong>
				</div>

			</div>

		</div>

		<div class="admin-content">


			<div class="mb-4">

				<h1 class="page-title">Delete Product</h1>

				<p class="page-subtitle">Remove product from your store</p>

			</div>

			<div class="admin-card">


				<div class="text-center" style="padding: 50px 20px;">

					<div class="mb-4">

						<i class="bi bi-exclamation-triangle-fill text-danger"
							style="font-size: 60px;"> </i>

					</div>



					<h3>Are you sure?</h3>



					<p class="text-muted mt-3">You are about to delete:</p>



					<h4 th:text="${product.name}" class="mb-3">Product Name</h4>



					<p class="text-muted">This action cannot be undone.</p>

					<form
						th:action="@{/admin/products/delete-confirm/{id}(id=${product.id})}"
						method="get" class="mt-4">


						<button type="submit" class="btn btn-danger me-2">

							<i class="bi bi-trash"></i> Yes, Delete

						</button>


						<a th:href="@{/admin/products}" class="btn btn-secondary"> <i
							class="bi bi-x-lg"></i> Cancel

						</a>


					</form>


				</div>

			</div>

		</div>

	</main>



	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>


</body>

</html>
