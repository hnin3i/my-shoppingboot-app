<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/admin_layout}">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>


</head>

<body>

		<!-- Content -->

		<section class="admin-content" layout:fragment="content">


			<h1 class="page-title">Dashboard</h1>

			<p class="page-subtitle">Welcome back, Admin 👋</p>


			<!-- STAT CARDS -->

			<div class="row g-4">


				<!-- Products -->

				<div class="col-xl-3 col-md-6">

					<div class="stat-card">

						<div class="stat-icon">

							<i class="bi bi-bag-fill"></i>

						</div>

						<div class="stat-title">Total Products</div>

						<div class="stat-number" th:text="${dashboard.totalProducts}">24</div>

					</div>

				</div>


				<!-- Categories -->

				<div class="col-xl-3 col-md-6">

					<div class="stat-card">

						<div class="stat-icon">

							<i class="bi bi-tags-fill"></i>

						</div>

						<div class="stat-title">Categories</div>

						<div class="stat-number" th:text="${dashboard.totalCategories}">6</div>

					</div>

				</div>


				<!-- Users -->

				<div class="col-xl-3 col-md-6">

					<div class="stat-card">

						<div class="stat-icon">

							<i class="bi bi-people-fill"></i>

						</div>

						<div class="stat-title">Users</div>

						<div class="stat-number" th:text="${dashboard.totalUsers}">128</div>

					</div>

				</div>


				<!-- Orders -->

				<div class="col-xl-3 col-md-6">

					<div class="stat-card">

						<div class="stat-icon">

							<i class="bi bi-cart-check-fill"></i>

						</div>

						<div class="stat-title">Orders</div>

						<div class="stat-number" th:text="${dashboard.totalOrders}">42</div>

					</div>

				</div>

			</div>


			<!-- SECOND ROW -->

			<div class="row g-4 mt-1">


				<!-- Recent Orders -->

				<div class="col-lg-8">

					<div class="admin-card">

						<div class="d-flex justify-content-between">

							<div class="admin-card-title">Recent Orders</div>

							<a href="/admin/orders" class="text-decoration-none"> View
								All </a>

						</div>


						<div class="table-responsive">

							<table class="admin-table">

								<thead>

									<tr>

										<th>ORDER ID</th>

										<th>USER</th>

										<th>DATE</th>

										<th>TOTAL</th>

										<th>STATUS</th>

									</tr>

								</thead>


								<tbody>

									<tr th:if="${#lists.isEmpty(dashboard.recentOrders)}">
										<td colspan="5" class="text-center text-muted">No recent
											orders found.</td>
									</tr>
									<tr th:each="order : ${dashboard.recentOrders}">
										<td th:text="${order.orderNumber}">#ORD001</td>

										<td th:text="${order.customerName}">May</td>

										<td
											th:text="${#dates.format(order.createdAt, 'dd MMM yyyy HH:mm')}">13
											Sep 2026</td>

										<td
											th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' MMK'">85,000
											MMK</td>

										<td><span class="status status-success"
											th:classappend="${order.status.name() == 'DELIVERED' or order.status.name() == 'CONFIRMED' ? 'status-success' : (order.status.name() == 'CANCELLED' ? 'status-danger' : 'status-warning')}"
											th:text="${order.status}"> Completed </span></td>

									</tr>

								</tbody>

							</table>

						</div>

					</div>

				</div>


				<!-- Stock -->

				<div class="col-lg-4">

					<div class="admin-card">

						<div class="admin-card-title">Stock Overview</div>


						<div class="mb-4">

							<div class="d-flex justify-content-between">

								<span>Total Stock</span> <strong
									th:text="${dashboard.totalStock}">156</strong>

							</div>

							<div class="progress mt-2" style="height: 7px;">

								<div class="progress-bar"
									style="width: 75%; background: #6c63ff;"></div>

							</div>

						</div>


						<div class="mb-4">

							<div class="d-flex justify-content-between">

								<span>Low Stock</span> <strong class="text-danger"
									th:text="${dashboard.lowStockCount}"> 5 </strong>

							</div>

							<div class="progress mt-2" style="height: 7px;">

								<div class="progress-bar bg-danger" style="width: 30%;"></div>

							</div>

						</div>


						<a href="/admin/stock" class="btn btn-purple w-100"> Manage
							Stock </a>

					</div>

				</div>

			</div>


		</section>


</body>

</html>
