<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - BLACKJACK Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Main -->
    <div class="admin-main">

        <!-- Topbar -->
        <div class="admin-topbar">
            <div class="admin-profile" style="margin-left: auto;">
                <div class="admin-avatar">A</div>
                <div>
                    <strong>Admin</strong>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="admin-content">

            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                   
                    <div class="page-title">
                        Order Details: <span class="text-purple" th:text="${order.orderNumber}"></span>
                    </div>
                    <div class="page-subtitle" th:if="${order.createdAt != null}" 
                         th:text="${#dates.format(order.createdAt, 'dd-MM-yyyy hh:mm a')}"></div>
                </div>
            </div>

            <div class="row g-4 align-items-start">
                
                <!-- Left Column: Customer Info & Itemized List -->
                <div class="col-lg-8">
                    
                    <!-- Customer & Delivery Info -->
                    <div class="admin-card mb-4">
                        <div class="admin-card-title mb-3">Customer & Delivery Info</div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <p class="mb-1"><strong>Name:</strong> <span th:text="${order.customerName}"></span></p>
                                <p class="mb-1"><strong>Phone:</strong> <span th:text="${order.customerPhone}"></span></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-0"><strong>Shipping Address:</strong> <span th:text="${order.shippingAddress}"></span></p>
                            </div>
                        </div>
                    </div>

                    <!-- Itemized Order List -->
                    <div class="admin-card">
                        <div class="admin-card-title mb-3">Itemized Order List</div>
                        <div class="table-responsive mb-3">
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Unit Price</th>
                                        <th>Qty</th>
                                        <th class="text-end">Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.items}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <img th:src="${item.productImage}" class="rounded me-3" style="width: 48px; height: 48px; object-fit: cover;" alt="Product">
                                                <span class="fw-bold" th:text="${item.productName}">Product Name</span>
                                            </div>
                                        </td>
                                        <td th:text="${#numbers.formatDecimal(item.unitPrice, 1, 'COMMA', 0, 'POINT')} + ' Ks'"></td>
                                        <td th:text="${item.quantity}"></td>
                                        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')} + ' Ks'"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Price Breakdown -->
                        <div class="border-top pt-3 text-end pe-2">
                            <p class="mb-1 text-muted">Subtotal: <span class="fw-bold text-dark" th:text="${#numbers.formatDecimal(order.subtotalAmount, 1, 'COMMA', 0, 'POINT')} + ' Ks'"></span></p>
                            <p class="mb-1 text-muted">Tax: <span class="fw-bold text-dark" th:text="${order.taxAmount} + ' %'"></span></p>
                            <p class="mb-1 text-muted">Shipping Fee: <span class="fw-bold text-dark" th:text="${#numbers.formatDecimal(order.shippingFee, 1, 'COMMA', 0, 'POINT')} + ' Ks'"></span></p>
                            <h5 class="fw-bold text-purple mt-2">Grand Total: <span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT')} + ' Ks'"></span></h5>
                        </div>
                    </div>

                </div>

                <!-- Right Column: Payment Slip (Top) + Status Management (Bottom) -->
                <div class="col-lg-4">
                    
                    <div class="admin-card">
                        
                        <!-- 1. Payment Slip Section (At Top) -->
                        <div class="admin-card-title mb-3">Payment Details</div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted mb-0 small">Payment Method:</label>
                            <div class="fw-bold text-uppercase fs-5 text-purple" th:text="${order.paymentMethod}">KPAY</div>
                        </div>

                        <div class="mb-3 text-center">
                            <div th:if="${order.paymentConfirmPhoto != null and !#strings.isEmpty(order.paymentConfirmPhoto)}">
                                <img th:src="${order.paymentConfirmPhoto}" 
                                     class="img-fluid rounded border shadow-sm w-100" 
                                     style="max-height: 250px; object-fit: contain;" 
                                     alt="Payment Slip">
                            </div>
                            <div th:if="${order.paymentConfirmPhoto == null or #strings.isEmpty(order.paymentConfirmPhoto)}" class="alert alert-secondary mb-0 p-2" role="alert">
                                <small class="text-muted">No Payment Slip Uploaded</small>
                            </div>
                        </div>

                        <hr class="text-muted my-3">

                        <!-- 2. Status Management Section (At Bottom) -->
                        <div class="fw-bold small mb-2">Update Order Status</div>

                        <!-- Update Status Form with Confirm Script -->
                        <form th:action="@{/admin/orders/update-status}" method="post" onsubmit="return confirmStatusUpdate()">
                            <input type="hidden" name="orderId" th:value="${order.id}" />

                            <!-- Payment Status Dropdown -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Payment Status</label>
                                <select class="form-select" name="paymentStatus">
                                    <option th:each="pStatus : ${allPaymentStatuses}"
                                            th:value="${pStatus}"
                                            th:text="${pStatus}"
                                            th:selected="${pStatus == order.paymentStatus}">
                                    </option>
                                </select>
                            </div>

                            <!-- Order Status Dropdown -->
                            <div class="mb-3">
                                <label class="form-label fw-bold small text-muted">Order Status</label>
                                <select class="form-select" name="status">
                                    <option th:each="oStatus : ${allOrderStatuses}"
                                            th:value="${oStatus}"
                                            th:text="${oStatus}"
                                            th:selected="${oStatus == order.status}">
                                    </option>
                                </select>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-purple w-100 fw-bold py-2">
                                Update Order Status
                            </button>
                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Confirmation Pop-up Script -->
    <script>
        function confirmStatusUpdate() {
            return confirm("Are you sure you want to update the order status?");
        }
    </script>

</body>
</html>
