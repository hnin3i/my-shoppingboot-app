<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}">
<title>Stock Management</title>
</head>
<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<main class="admin-main">

		<!-- Topbar -->
		<header class="admin-topbar">
			<div class="search-box">
				<i class="bi bi-search"></i>
				<input type="text" id="stockSearch" placeholder="Search product...">
			</div>

			<div class="admin-profile">
				<i class="bi bi-bell fs-5"></i>
				<div class="admin-avatar">A</div>
			</div>
		</header>

		<!-- Content -->
		<section class="admin-content">

			<!-- Flash messages -->
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<h1 class="page-title">Stock Items</h1>
					<p class="page-subtitle mb-0">Manage product stock and quantities</p>
				</div>

				<a th:href="@{/admin/stock/add}" class="btn btn-purple">
					<i class="bi bi-plus-lg"></i> Add Stock
				</a>
			</div>

			<!-- Stock Statistics -->
			<div class="row g-4 mb-4">

				<div class="col-md-3">
					<div class="stat-card">
						<div class="stat-icon"><i class="bi bi-box-seam"></i></div>
						<div class="stat-title">Total Quantity</div>
						<div class="stat-number" th:text="${totalQuantity}">0</div>
					</div>
				</div>

				<div class="col-md-3">
					<div class="stat-card">
						<div class="stat-icon"><i class="bi bi-bag"></i></div>
						<div class="stat-title">Products</div>
						<div class="stat-number" th:text="${productCount}">0</div>
					</div>
				</div>

				<div class="col-md-3">
					<div class="stat-card">
						<div class="stat-icon"><i class="bi bi-tags"></i></div>
						<div class="stat-title">Categories</div>
						<div class="stat-number" th:text="${categoryCount}">0</div>
					</div>
				</div>

				<div class="col-md-3">
					<div class="stat-card">
						<div class="stat-icon text-danger" style="background:#fff0f0;">
							<i class="bi bi-exclamation-triangle"></i>
						</div>
						<div class="stat-title">Low Stock</div>
						<div class="stat-number text-danger" th:text="${lowStockCount}">0</div>
					</div>
				</div>

			</div>

			<!-- Stock Table -->
			<div class="admin-card">

				<div class="row g-3 mb-4">
					<div class="col-md-12">
						<div class="search-box w-100">
							<i class="bi bi-search"></i>
							<input type="text" id="stockSearchTable" placeholder="Search product...">
						</div>
					</div>
				</div>

				<div class="table-responsive">
					<table class="admin-table">
						<thead>
							<tr>
								<th>PRODUCT</th>
								<th>COLOUR</th>
								<th>SIZE</th>
								<th>QUANTITY</th>
								<th>STATUS</th>
								<th class="text-end">ACTION</th>
							</tr>
						</thead>

						<tbody>

							<tr th:each="stock : ${stocks}" class="stock-row">

								<td th:text="${stock.productName}">Product Name</td>

								<td th:text="${stock.colour}">Colour</td>

								<td th:text="${stock.size}">Size</td>

								<td th:text="${stock.stockQty}">0</td>

								<td>
									<span th:if="${!stock.lowStock}" class="status status-success">In Stock</span>
									<span th:if="${stock.lowStock}" class="status status-danger">Low Stock</span>
								</td>

								<td class="text-end">
									<a th:href="@{/admin/stock/edit/{id}(id=${stock.id})}"
										class="btn btn-sm btn-light me-1" title="Edit">
										<i class="bi bi-pencil"></i>
									</a>
									<a th:href="@{/admin/stock/delete/{id}(id=${stock.id})}"
										class="btn btn-sm btn-outline-danger" title="Delete">
										<i class="bi bi-trash"></i>
									</a>
								</td>
							</tr>

							<tr th:if="${#lists.isEmpty(stocks)}">
								<td colspan="6" class="text-center py-4">No stock records found.</td>
							</tr>

						</tbody>
					</table>
				</div>

			</div>

		</section>

	</main>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

	<!-- Simple client-side search (product name / colour / size) -->
	<script>
		const searchBoxes = document.querySelectorAll("#stockSearch, #stockSearchTable");
		const stockRows = document.querySelectorAll(".stock-row");

		function filterStocks(value) {
			const searchText = value.toLowerCase().trim();
			stockRows.forEach(function(row) {
				const rowText = row.innerText.toLowerCase();
				row.style.display = rowText.includes(searchText) ? "" : "none";
			});
		}

		searchBoxes.forEach(function(box) {
			box.addEventListener("input", function() {
				filterStocks(this.value);
			});
		});
	</script>

</body>
</html>
