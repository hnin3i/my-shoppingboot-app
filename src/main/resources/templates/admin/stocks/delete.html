<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Stock - BLACKJACK Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<div class="admin-main">

		<div class="admin-topbar">
			<div class="admin-profile" style="margin-left: auto;">
				<div class="admin-avatar">A</div>
				<div><strong>Admin</strong></div>
			</div>
		</div>

		<div class="admin-content">

			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<div class="page-title">Delete Stock</div>
				</div>
			</div>

			<div class="admin-card text-center py-5">

				<div class="mb-4">
					<i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 60px;"></i>
				</div>

				<h4 class="mb-3">Delete Stock Record?</h4>

				<p class="text-muted">
					Are you sure you want to delete the stock record for
					<strong th:text="${stock.productName}">Product</strong> ?
				</p>

				<button type="button" class="btn btn-danger me-2"
					data-bs-toggle="modal" data-bs-target="#deleteModal">
					<i class="bi bi-trash"></i> Delete
				</button>

				<a th:href="@{/admin/stock}" class="btn btn-secondary">
					<i class="bi bi-arrow-left"></i> Cancel
				</a>

			</div>

		</div>

	</div>

	<!-- DELETE CONFIRMATION MODAL -->
	<div class="modal fade" id="deleteModal" tabindex="-1"
		aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">

				<div class="modal-header">
					<h5 class="modal-title" id="deleteModalLabel">
						<i class="bi bi-exclamation-triangle-fill text-danger"></i> Confirm Delete
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>

				<div class="modal-body text-center">
					<i class="bi bi-trash3 text-danger" style="font-size: 50px;"></i>
					<p class="mt-3 mb-1">Are you sure you want to delete</p>
					<h5><strong th:text="${stock.productName}">Product</strong> ?</h5>
					<p class="text-muted small">This action cannot be undone.</p>
				</div>

				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
						<i class="bi bi-x-lg"></i> Cancel
					</button>

					<form th:action="@{/admin/stock/delete}" th:object="${stock}" method="post">
						<input type="hidden" th:field="*{id}">
						<button type="submit" class="btn btn-danger">
							<i class="bi bi-trash"></i> Yes, Delete
						</button>
					</form>
				</div>

			</div>
		</div>
	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
