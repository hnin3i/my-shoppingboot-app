<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Stock - BLACKJACK Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<div class="admin-main">

		<div class="admin-topbar">
			<div class="admin-profile" style="margin-left: auto;">
				<div class="admin-avatar">A</div>
				<div><strong>Admin</strong></div>
			</div>
		</div>

		<div class="admin-content">

			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<div class="page-title">Edit Stock</div>
				</div>
			</div>

			<div class="admin-card">

				<form th:action="@{/admin/stock/edit}" th:object="${stock}" method="post">

					<div th:if="${error}" style="color: red; margin-bottom: 15px;">
						<strong>Error:</strong> <span th:text="${error}"></span>
					</div>

					<input type="hidden" th:field="*{id}">

					<!-- Product -->
					<div class="mb-3 row">
						<label for="selectProduct" class="col-sm-2 col-form-label">Product :</label>
						<div class="col-sm-5">
							<select class="form-select" id="selectProduct" th:field="*{productsId}">
								<option value="">-- Select a product --</option>
								<option th:each="product : ${products}"
									th:value="${product.id}"
									th:text="${product.name}">Product Name</option>
							</select>
						</div>
					</div>

					<!-- Quantity -->
					<div class="mb-3 row">
						<label for="InputQty" class="col-sm-2 col-form-label">Quantity :</label>
						<div class="col-sm-5">
							<input type="number" min="0" class="form-control" id="InputQty"
								th:field="*{stockQty}">
						</div>
					</div>

					<div class="mt-4">
						<button type="submit" class="btn btn-primary me-2">
							<i class="bi bi-check-lg"></i> Save Changes
						</button>

						<a th:href="@{/admin/stock}" class="btn btn-secondary">
							<i class="bi bi-x-lg"></i> Cancel
						</a>
					</div>

				</form>

			</div>

		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
